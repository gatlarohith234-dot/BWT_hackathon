(function(){function showError(msg){var r=document.getElementById('root');if(!r)return;r.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:#f0f4f8;font-family:Inter,sans-serif;"><div style="max-width:600px;background:#fff;border:1px solid #fecaca;border-radius:16px;padding:2rem;"><h2 style="color:#dc2626;margin:0 0 1rem;">Error</h2><pre style="background:#f8fafc;padding:12px;border-radius:8px;font-size:12px;overflow:auto;max-height:280px;white-space:pre-wrap;">'+String(msg).replace(/</g,'&lt;')+'</pre></div></div>';console.error(msg);}window.addEventListener('error',function(e){showError(e.message||'Unknown error');});window.addEventListener('unhandledrejection',function(e){showError('Promise: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason)));});})();

<script type="text/babel" data-presets="react">

// Error boundary
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(e){return{hasError:true,error:e};}
  componentDidCatch(e,i){console.error('[Tailor]',e,i);}
  render(){
    if(this.state.hasError){
      const m=this.state.error&&this.state.error.message?this.state.error.message:String(this.state.error);
      return React.createElement('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'2rem',background:'#f0f4f8',fontFamily:'Inter,sans-serif'}},
        React.createElement('div',{style:{maxWidth:'600px',background:'#fff',border:'1px solid #fecaca',borderRadius:'16px',padding:'2rem'}},
          React.createElement('h2',{style:{color:'#dc2626',margin:'0 0 1rem'}},'Something went wrong'),
          React.createElement('pre',{style:{background:'#f8fafc',padding:'12px',borderRadius:'8px',fontSize:'12px',overflow:'auto',maxHeight:'280px',whiteSpace:'pre-wrap'}},m),
          React.createElement('button',{onClick:()=>window.location.reload(),style:{marginTop:'1rem',padding:'0.6rem 1rem',background:'#102a43',color:'white',border:'none',borderRadius:'6px',cursor:'pointer'}},'Reload')
        )
      );
    }
    return this.props.children;
  }
}

/* ============================================================ THEMES ============================================================ */
const THEMES=[
  {id:'navy-gold',name:'Navy Gold',swatch:['#102a43','#d98e2b'],mode:'light'},
  {id:'ocean',name:'Ocean',swatch:['#3b82f6','#f59e0b'],mode:'light'},
  {id:'cream',name:'Cream',swatch:['#faf5e6','#c8823c'],mode:'light'},
  {id:'rose',name:'Rose',swatch:['#f43f5e','#fb7185'],mode:'light'},
  {id:'emerald',name:'Emerald',swatch:['#16a34a','#eab308'],mode:'light'},
  {id:'lavender',name:'Lavender',swatch:['#9333ea','#ec4899'],mode:'light'},
  {id:'midnight-purple',name:'Midnight Purple',swatch:['#1a1a2e','#8b5cf6'],mode:'dark'},
  {id:'forest',name:'Forest',swatch:['#142319','#22c55e'],mode:'dark'},
  {id:'charcoal',name:'Charcoal',swatch:['#1e1e1e','#ea580c'],mode:'dark'},
  {id:'slate-dark',name:'Slate Dark',swatch:['#1e293b','#38bdf8'],mode:'dark'},
];

function applyTheme(id){
  try{
    const t=THEMES.find(x=>x.id===id)||THEMES[0];
    document.documentElement.setAttribute('data-theme',t.id);
    document.documentElement.setAttribute('data-dark',t.mode==='dark'?'1':'0');
    try{localStorage.setItem('tailor_theme',t.id);}catch(e){}
  }catch(e){}
}

function Icon({name,size=16,className='',strokeWidth=2}){
  const lib=window.lucide?(window.lucide.icons||window.lucide):null;
  if(!lib)return React.createElement('span',{style:{display:'inline-block',width:size,height:size}});
  const node=lib[name]||lib[name.charAt(0).toUpperCase()+name.slice(1)];
  if(!node||!Array.isArray(node))return React.createElement('span',{style:{display:'inline-block',width:size,height:size}});
  return React.createElement('svg',{xmlns:'http://www.w3.org/2000/svg',width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:strokeWidth,strokeLinecap:'round',strokeLinejoin:'round',className:className},
    (node[2]||[]).map((c,i)=>React.createElement(c[0],{key:i,...(c[1]||{})}))
  );
}

function ThemeSwitcher({compact=false}){
  const [open,setOpen]=useState(false);
  const [current,setCurrent]=useState(()=>{try{return localStorage.getItem('tailor_theme')||'navy-gold';}catch(e){return'navy-gold';}});
  const ref=useRef(null);
  useEffect(()=>{applyTheme(current);},[current]);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const pick=id=>{setCurrent(id);setOpen(false);};
  const active=THEMES.find(t=>t.id===current)||THEMES[0];
  return (
    <div ref={ref} className="relative">
      <button type="button" onClick={()=>setOpen(o=>!o)}
        className="flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium"
        style={{borderColor:'rgb(var(--navy-200))',background:'rgb(var(--card-bg))',color:'rgb(var(--navy-700))',cursor:'pointer'}}>
        <Icon name="Palette" size={16}/>
        {!compact&&<span className="hidden sm:inline">{active.name}</span>}
        <div className="flex -space-x-1">
          <span className="h-3 w-3 rounded-full border border-white" style={{background:active.swatch[0]}}/>
          <span className="h-3 w-3 rounded-full border border-white" style={{background:active.swatch[1]}}/>
        </div>
      </button>
      {open&&(
        <div className="absolute right-0 mt-2 w-64 rounded-xl border shadow-lg"
          style={{borderColor:'rgb(var(--navy-200))',background:'rgb(var(--card-bg))',zIndex:999,maxHeight:'min(420px,70vh)',overflowY:'auto'}}>
          <p className="sticky top-0 px-3.5 py-2 text-[11px] font-semibold uppercase tracking-wider" style={{background:'rgb(var(--card-bg))',color:'rgb(var(--navy-400))'}}>Choose theme</p>
          {THEMES.map(t=>(
            <button key={t.id} type="button" onClick={()=>pick(t.id)}
              className="flex w-full items-center gap-3 px-3.5 py-2.5 text-left text-sm"
              style={{color:'rgb(var(--navy-700))',background:t.id===current?'rgb(var(--navy-100))':'transparent',cursor:'pointer'}}>
              <div className="flex -space-x-1.5">
                <span className="h-5 w-5 rounded-full border-2 border-white" style={{background:t.swatch[0]}}/>
                <span className="h-5 w-5 rounded-full border-2 border-white" style={{background:t.swatch[1]}}/>
              </div>
              <span className="flex-1 font-medium">{t.name}</span>
              {t.mode==='dark'&&<Icon name="Moon" size={13}/>}
              {t.mode==='light'&&<Icon name="Sun" size={13}/>}
              {t.id===current&&<Icon name="Check" size={14}/>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================ HELPERS ============================================================ */
function fmtC(v){return '₹'+(Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:0});}
function fmtD(d){if(!d)return '—';const dt=typeof d==='string'&&d.length===10?new Date(d+'T00:00:00'):new Date(d);if(isNaN(dt))return '—';return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDT(d){if(!d)return '—';const dt=new Date(d);if(isNaN(dt))return '—';return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function todayStr(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString().split('T')[0];}
function addDays(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function initials(n){if(!n)return '?';return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function greeting(){const h=new Date().getHours();if(h<12)return 'Good Morning';if(h<17)return 'Good Afternoon';return 'Good Evening';}
function dueInfo(dd,stage){
  if(stage==='Delivered')return{label:'Delivered',severity:'done'};
  if(!dd)return{label:'No date',severity:'future'};
  const t=new Date();t.setHours(0,0,0,0);
  const due=new Date(dd+'T00:00:00');
  const diff=Math.ceil((due-t)/86400000);
  if(diff<0)return{label:'Overdue '+Math.abs(diff)+'d',severity:'overdue'};
  if(diff===0)return{label:'Due Today',severity:'today'};
  if(diff<=3)return{label:'Due in '+diff+'d',severity:'soon'};
  return{label:'Due in '+diff+'d',severity:'future'};
}
function waLink(phone,msg){const c=String(phone||'').replace(/\D/g,'');const f=c.length===10?'91'+c:c;return 'https://wa.me/'+f+'?text='+encodeURIComponent(msg);}

function CustomerForm({initial,onSubmit,onCancel,loading}){
  const [name,setName]=useState(initial?.name||'');
  const [phone,setPhone]=useState(initial?.phone||'');
  const [err,setErr]=useState({});
  const submit=e=>{
    e.preventDefault();
    const p={};
    if(!name.trim())p.name='Name required';
    if(!/^\d{10}$/.test(phone.replace(/\D/g,'')))p.phone='Valid 10-digit phone required';
    setErr(p);
    if(Object.keys(p).length)return;
    onSubmit({name:name.trim(),phone:phone.replace(/\D/g,'')});
  };
  return (
    <form onSubmit={submit} className="space-y-4">
      <div>
        <label className="label">Customer Name *</label>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Rahul Kumar" className="input" autoFocus/>
        {err.name&&<p className="mt-1 text-xs text-red-600">{err.name}</p>}
      </div>
      <div>
        <label className="label">Phone Number *</label>
        <input value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g,'').slice(0,10))} placeholder="10-digit mobile" inputMode="numeric" className="input"/>
        {err.phone&&<p className="mt-1 text-xs text-red-600">{err.phone}</p>}
      </div>
      <div className="flex justify-end gap-2 pt-2">
        <button type="button" onClick={onCancel} className="btn-outline" disabled={loading}>Cancel</button>
        <button type="submit" className="btn-primary" disabled={loading}>{loading?'Saving…':initial?'Update':'Add Customer'}</button>
      </div>
    </form>
  );
}

function MeasurementForm({initial={},onSubmit,onCancel,loading}){
  const [values,setValues]=useState(()=>{
    const b={};
    MEASUREMENT_FIELDS.forEach(f=>{b[f.key]=initial[f.key]!==undefined?initial[f.key]:'';});
    Object.keys(initial).forEach(k=>{if(!MEASUREMENT_FIELDS.find(f=>f.key===k))b[k]=initial[k];});
    return b;
  });
  const [custom,setCustom]=useState(()=>Object.keys(initial).filter(k=>!MEASUREMENT_FIELDS.find(f=>f.key===k)));
  const [newF,setNewF]=useState('');
  const upd=(k,v)=>setValues(p=>({...p,[k]:v.replace(/[^0-9.]/g,'')}));
  const submit=e=>{
    e.preventDefault();
    const c={};
    Object.entries(values).forEach(([k,v])=>{if(v!==''&&v!=null){const n=Number(v);if(!isNaN(n)&&n>=0&&n<=100)c[k]=n;}});
    onSubmit(c);
  };
  const addC=()=>{const k=newF.trim().toLowerCase().replace(/\s+/g,'_');if(!k||values[k]!==undefined)return;setCustom(p=>[...p,k]);setValues(p=>({...p,[k]:''}));setNewF('');};
  const rmC=k=>{setCustom(p=>p.filter(x=>x!==k));setValues(p=>{const n={...p};delete n[k];return n;});};
  return (
    <form onSubmit={submit} className="space-y-5">
      <div className="flex items-center gap-2 rounded-lg px-3.5 py-2.5 text-xs font-medium" style={{background:'rgb(var(--gold-50))',color:'rgb(var(--gold-700))'}}>
        <Icon name="Ruler" size={14}/> Measurements in inches. Leave blank any that don't apply.
      </div>
      <div className="grid grid-cols-2 gap-4 sm:grid-cols-3">
        {MEASUREMENT_FIELDS.map(f=>(
          <div key={f.key}>
            <label className="label">{f.label}</label>
            <input value={values[f.key]??''} onChange={e=>upd(f.key,e.target.value)} placeholder="0" inputMode="decimal" className="input"/>
          </div>
        ))}
      </div>
      {custom.length>0&&(
        <div className="grid grid-cols-2 gap-4 border-t pt-4 sm:grid-cols-3" style={{borderColor:'rgb(var(--navy-200))'}}>
          {custom.map(k=>(
            <div key={k} className="relative">
              <label className="label capitalize">{k.replace(/_/g,' ')}</label>
              <input value={values[k]??''} onChange={e=>upd(k,e.target.value)} placeholder="0" inputMode="decimal" className="input pr-9"/>
              <button type="button" onClick={()=>rmC(k)} className="absolute right-2 top-8 rounded p-1" style={{cursor:'pointer'}}><Icon name="X" size={13}/></button>
            </div>
          ))}
        </div>
      )}
      <div className="flex items-center gap-2">
        <input value={newF} onChange={e=>setNewF(e.target.value)} placeholder="Add custom measurement…" className="input flex-1"/>
        <button type="button" onClick={addC} className="btn-outline shrink-0"><Icon name="Plus" size={15}/> Add</button>
      </div>
      <div className="flex justify-end gap-2 border-t pt-4" style={{borderColor:'rgb(var(--navy-200))'}}>
        <button type="button" onClick={onCancel} className="btn-outline" disabled={loading}>Cancel</button>
        <button type="submit" className="btn-primary" disabled={loading}>{loading?'Saving…':'Save Measurements'}</button>
      </div>
    </form>
  );
}

function OrderForm({customers,initial,onSubmit,onCancel,loading}){
  const [form,setForm]=useState({
    customer_id:initial?.customer_id||'',
    garment:initial?.garment||'Shirt',
    fabric:initial?.fabric||'',
    price:initial?.price!==undefined?initial.price:'',
    advance:initial?.advance!==undefined?initial.advance:'',
    delivery_date:initial?.delivery_date||'',
    notes:initial?.notes||'',
  });
  const [err,setErr]=useState({});
  const bal=(Number(form.price)||0)-(Number(form.advance)||0);
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const submit=e=>{
    e.preventDefault();
    const p={};
    if(!form.customer_id)p.customer_id='Select a customer';
    if(!form.garment)p.garment='Required';
    if(form.price===''||Number(form.price)<0)p.price='Enter a valid price';
    if(Number(form.advance)<0)p.advance='Cannot be negative';
    if(Number(form.advance)>Number(form.price))p.advance='Cannot exceed price';
    if(!form.delivery_date)p.delivery_date='Required';
    setErr(p);
    if(Object.keys(p).length)return;
    onSubmit({...form,price:Number(form.price),advance:Number(form.advance)||0});
  };
  return (
    <form onSubmit={submit} className="space-y-5">
      <div className="grid gap-4 sm:grid-cols-2">
        <div className="sm:col-span-2">
          <label className="label">Customer *</label>
          <select value={form.customer_id} onChange={e=>set('customer_id',e.target.value)} className="input">
            <option value="">Select a customer…</option>
            {customers.map(c=><option key={c.id} value={c.id}>{c.name} · {c.phone}</option>)}
          </select>
          {err.customer_id&&<p className="mt-1 text-xs text-red-600">{err.customer_id}</p>}
        </div>
        <div>
          <label className="label">Garment Type *</label>
          <select value={form.garment} onChange={e=>set('garment',e.target.value)} className="input">
            {GARMENTS.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
        </div>
        <div>
          <label className="label">Fabric Details</label>
          <input value={form.fabric} onChange={e=>set('fabric',e.target.value)} placeholder="Cotton, Silk…" className="input" list="fabrics"/>
          <datalist id="fabrics">{FABRICS.map(f=><option key={f} value={f}/>)}</datalist>
        </div>
        <div>
          <label className="label">Total Price *</label>
          <input type="number" min="0" value={form.price} onChange={e=>set('price',e.target.value)} placeholder="0" className="input"/>
          {err.price&&<p className="mt-1 text-xs text-red-600">{err.price}</p>}
        </div>
        <div>
          <label className="label">Advance Paid</label>
          <input type="number" min="0" value={form.advance} onChange={e=>set('advance',e.target.value)} placeholder="0" className="input"/>
          {err.advance&&<p className="mt-1 text-xs text-red-600">{err.advance}</p>}
        </div>
        <div className="sm:col-span-2">
          <label className="label">Delivery Date *</label>
          <input type="date" value={form.delivery_date} onChange={e=>set('delivery_date',e.target.value)} className="input"/>
          {err.delivery_date&&<p className="mt-1 text-xs text-red-600">{err.delivery_date}</p>}
        </div>
        <div className="sm:col-span-2">
          <label className="label">Notes</label>
          <textarea value={form.notes} onChange={e=>set('notes',e.target.value)} rows={2} placeholder="Special instructions…" className="input resize-none"/>
        </div>
      </div>
      <div className="rounded-xl border p-4" style={{borderColor:'rgb(var(--navy-200))',background:'rgb(var(--navy-50))'}}>
        <div className="grid grid-cols-3 gap-2 text-center">
          <div><p className="text-[11px] font-semibold uppercase" style={{color:'rgb(var(--navy-400))'}}>Total</p><p className="mt-1 text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>₹{Number(form.price)||0}</p></div>

        </div>
      </div>
      <div className="flex justify-end gap-2 border-t pt-4" style={{borderColor:'rgb(var(--navy-200))'}}>
        <button type="button" onClick={onCancel} className="btn-outline" disabled={loading}>Cancel</button>
        <button type="submit" className="btn-gold" disabled={loading}>{loading?'Saving…':initial?'Update Order':'Create Order'}</button>
      </div>
    </form>
  );
}

/* ============================================================ PORTAL (login/signup) ============================================================ */
function Portal({mode,onBack,onLogin,onSignup}){
  const isAdmin=mode==='admin';
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [shop,setShop]=useState('');
  const [sub,setSub]=useState('login');
  const [show,setShow]=useState(false);
  const [msg,setMsg]=useState('');
  const [busy,setBusy]=useState(false);

  const submit=async e=>{
    e.preventDefault();
    setMsg('');setBusy(true);
    try{
      if(isAdmin){
        if(!email||!password)throw new Error('Enter username and password.');
        await onLogin(email,password);
        return;
      }
      if(sub==='signup'&&!shop.trim())throw new Error('Shop name is required.');
      if(!email||!password)throw new Error('Email and password are required.');
      if(password.length<6)throw new Error('Password must be at least 6 characters.');
      if(sub==='signup')await onSignup(email,password,shop.trim());
      else await onLogin(email,password);
    }catch(err){setMsg(err.message||String(err));}
    finally{setBusy(false);}
  };

  return (
    <div className="flex min-h-screen" style={{background:'rgb(var(--navy-50))'}}>
      <div className="hidden lg:flex lg:w-1/2 flex-col justify-between p-12 relative overflow-hidden" style={{background:'rgb(var(--navy-950))'}}>
        <div className="pointer-events-none absolute inset-0" style={{opacity:0.04,backgroundImage:'radial-gradient(circle at 1px 1px, white 1px, transparent 0)',backgroundSize:'32px 32px'}}/>
        <button type="button" onClick={onBack} className="relative flex items-center gap-2 text-sm" style={{color:'rgb(var(--navy-400))',cursor:'pointer'}}>
          <Icon name="ArrowLeft" size={16}/> Back
        </button>
        <div className="relative">
          <div className="flex items-center gap-3">
            <div className="flex h-12 w-12 items-center justify-center rounded-xl" style={{background:'rgba(232,168,78,0.15)'}}>
              <Icon name={isAdmin?'Shield':'Store'} size={24} color="#e8a84e"/>
            </div>
            <div>
              <h2 className="text-lg font-semibold text-white">{isAdmin?'Admin Portal':'Shop Portal'}</h2>
              <p className="text-xs" style={{color:'rgb(var(--navy-400))'}}>{isAdmin?'Platform management':'Your tailoring business'}</p>
            </div>
          </div>
          <h3 className="mt-8 text-3xl font-bold text-white">{isAdmin?'Platform administration.':'Your shop, perfectly managed.'}</h3>
          <p className="mt-4 max-w-md text-sm" style={{color:'rgb(var(--navy-400))'}}>{isAdmin?'See every shop, every order, every customer across the platform.':"Sign up free and start adding customers, orders, and payments today. Syncs live across every device."}</p>
        </div>
        <p className="relative text-[11px]" style={{color:'rgb(var(--navy-600))'}}>© 2026 Tailor Order Manager</p>
      </div>

      <div className="flex w-full lg:w-1/2 items-center justify-center p-6">
        <div className="w-full max-w-sm">
          <div className="mb-4 flex items-center justify-between">
            <button type="button" onClick={onBack} className="flex items-center gap-1.5 text-xs lg:hidden" style={{color:'rgb(var(--navy-500))',cursor:'pointer'}}>
              <Icon name="ArrowLeft" size={14}/> Back
            </button>
            <ThemeSwitcher compact/>
          </div>

          {!isAdmin&&(
            <div className="mb-5 flex rounded-xl p-1" style={{background:'rgb(var(--navy-100))'}}>
              <button type="button" onClick={()=>{setSub('login');setMsg('');}} className="flex-1 rounded-lg px-3 py-2 text-sm font-medium" style={{background:sub==='login'?'rgb(var(--card-bg))':'transparent',color:sub==='login'?'rgb(var(--navy-900))':'rgb(var(--navy-500))',cursor:'pointer'}}>Log In</button>
              <button type="button" onClick={()=>{setSub('signup');setMsg('');}} className="flex-1 rounded-lg px-3 py-2 text-sm font-medium" style={{background:sub==='signup'?'rgb(var(--card-bg))':'transparent',color:sub==='signup'?'rgb(var(--navy-900))':'rgb(var(--navy-500))',cursor:'pointer'}}>Sign Up</button>
            </div>
          )}

          <h2 className="text-2xl font-bold" style={{color:'rgb(var(--navy-900))'}}>{isAdmin?'Admin login':sub==='login'?'Welcome back':'Create your shop'}</h2>
          <p className="mt-1 text-sm" style={{color:'rgb(var(--navy-500))'}}>{isAdmin?'Enter admin credentials.':sub==='login'?'Sign in to your shop.':'Free forever. No credit card.'}</p>

          <form onSubmit={submit} className="mt-7 space-y-4">
            {!isAdmin&&sub==='signup'&&(
              <div><label className="label">Shop Name</label><input value={shop} onChange={e=>setShop(e.target.value)} placeholder="Perfect Fit Tailors" className="input"/></div>
            )}
            <div>
              <label className="label">{isAdmin?'Username':'Email'}</label>
              <input type={isAdmin?'text':'email'} value={email} onChange={e=>setEmail(e.target.value)} placeholder={isAdmin?'admin':'you@example.com'} className="input" autoFocus/>
            </div>
            <div>
              <label className="label">Password</label>
              <div className="relative">
                <input type={show?'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} placeholder={isAdmin?'123':'At least 6 characters'} className="input pr-10"/>
                <button type="button" onClick={()=>setShow(!show)} className="absolute right-3 top-1/2 -translate-y-1/2" style={{cursor:'pointer'}}><Icon name={show?'EyeOff':'Eye'} size={15}/></button>
              </div>
            </div>
            {msg&&<div className="rounded-lg border border-red-200 px-3.5 py-2.5 text-xs text-red-700" style={{background:'#fef2f2'}}>{msg}</div>}
            <button type="submit" className="btn-primary w-full" disabled={busy}>{busy?'Please wait…':isAdmin?'Sign In as Admin':sub==='login'?'Sign In':'Create Account'}</button>
          </form>

          {isAdmin&&(
            <div className="mt-5 rounded-lg px-4 py-3 text-xs" style={{background:'rgb(var(--gold-50))',border:'1px solid rgb(var(--gold-200))',color:'rgb(var(--gold-700))'}}>
              <strong>Demo credentials:</strong> <code>admin</code> / <code>123</code>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================ ADMIN DASHBOARD (with full data) ============================================================ */
function AdminDashboard({adminUser,onLogout,toast}){
  const [tab,setTab]=useState('overview'); // overview | customers | orders | admins
  const [customers,setCustomers]=useState([]);
  const [orders,setOrders]=useState([]);
  const [admins,setAdmins]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [newAdmin,setNewAdmin]=useState({u:'',p:''});
  const [confirmDel,setConfirmDel]=useState(null);
  const [busy,setBusy]=useState(false);

  // load all data
  const loadAll=useCallback(async()=>{
    if(!supabase)return;
    setLoading(true);
    try{
      const [c,o,a]=await Promise.all([
        supabase.from('customers').select('*').order('created_at',{ascending:false}),
        supabase.from('orders').select('*').order('created_at',{ascending:false}),
        supabase.from('platform_admins').select('*').order('created_at',{ascending:true}),
      ]);
      if(c.error)toast.error('Customers: '+c.error.message);else setCustomers(c.data||[]);
      if(o.error)toast.error('Orders: '+o.error.message);else setOrders(o.data||[]);
      if(a.error)toast.error('Admins: '+a.error.message);else{
        const extras=(a.data||[]).filter(x=>x.username!=='admin').map(x=>({...x,isDefault:false}));
        setAdmins([{id:'root',username:'admin',isDefault:true,created_at:null},...extras]);
      }
    }catch(e){toast.error('Load failed: '+e.message);}
    finally{setLoading(false);}
  },[toast]);

  useEffect(()=>{loadAll();},[loadAll]);

  // realtime
  useEffect(()=>{
    if(!supabase)return;
    const ch=supabase.channel('admin-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'customers'},()=>loadAll())
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadAll())
      .on('postgres_changes',{event:'*',schema:'public',table:'platform_admins'},()=>loadAll())
      .subscribe();
    return()=>{try{supabase.removeChannel(ch);}catch(e){}};
  },[loadAll]);

  const stats=useMemo(()=>{
    const totalRevenue=orders.reduce((s,o)=>s+Number(o.advance||0),0);
    const pendingRevenue=orders.filter(o=>o.stage!=='Delivered').reduce((s,o)=>s+Math.max(0,Number(o.price||0)-Number(o.advance||0)),0);
    const activeOrders=orders.filter(o=>o.stage!=='Delivered').length;
    const shops=new Set(customers.map(c=>c.user_id)).size;
    const customersByShop={};
    customers.forEach(c=>{customersByShop[c.user_id]=(customersByShop[c.user_id]||0)+1;});
    return{totalShops:shops,totalCustomers:customers.length,totalOrders:orders.length,totalRevenue,pendingRevenue,activeOrders,customersByShop};
  },[customers,orders]);

  const filteredCustomers=useMemo(()=>{
    const q=search.toLowerCase().trim();
    if(!q)return customers;
    return customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
  },[customers,search]);

  const filteredOrders=useMemo(()=>{
    const q=search.toLowerCase().trim();
    if(!q)return orders;
    return orders.filter(o=>o.order_code.toLowerCase().includes(q)||o.garment.toLowerCase().includes(q));
  },[orders,search]);

  const addAdmin=async e=>{
    e.preventDefault();
    if(!newAdmin.u.trim()||!newAdmin.p.trim()){toast.error('Username and password required.');return;}
    if(newAdmin.p.length<3){toast.error('Password must be at least 3 characters.');return;}
    const clean=newAdmin.u.trim().toLowerCase();
    if(clean==='admin'){toast.error('"admin" is reserved.');return;}
    setBusy(true);
    try{
      const r=await supabase.from('platform_admins').insert({username:clean,password:newAdmin.p.trim()});
      if(r.error){if(r.error.code==='23505')throw new Error('Username already taken.');throw r.error;}
      toast.success('Admin added.');
      setNewAdmin({u:'',p:''});
      loadAll();
    }catch(err){toast.error(err.message);}
    finally{setBusy(false);}
  };

  const delAdmin=async()=>{
    if(!confirmDel)return;
    try{
      const r=await supabase.from('platform_admins').delete().eq('id',confirmDel.id);
      if(r.error)throw r.error;
      toast.success('Admin removed.');
      setConfirmDel(null);
      loadAll();
    }catch(e){toast.error(e.message);}
  };

  const getCustomer=id=>customers.find(c=>c.id===id);

  return (
    <div className="min-h-screen" style={{background:'rgb(var(--navy-50))'}}>
      <header className="border-b" style={{borderColor:'rgb(var(--navy-200))',background:'rgb(var(--card-bg))'}}>
        <div className="mx-auto flex max-w-7xl items-center justify-between gap-2 px-4 py-4 sm:px-6">
          <div className="flex items-center gap-3">
            <div className="flex h-10 w-10 items-center justify-center rounded-xl" style={{background:'rgb(var(--navy-900))'}}><Icon name="Shield" size={20} color="#e8a84e"/></div>
            <div className="hidden sm:block">
              <h1 className="text-sm font-bold" style={{color:'rgb(var(--navy-900))'}}>Admin Portal</h1>
              <p className="text-[11px]" style={{color:'rgb(var(--navy-500))'}}>Signed in as {adminUser}</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <ThemeSwitcher/>
            <button type="button" onClick={onLogout} className="btn-outline btn-sm" style={{color:'#dc2626',cursor:'pointer'}}><Icon name="LogOut" size={14}/> <span className="hidden sm:inline">Sign Out</span></button>
          </div>
        </div>
      </header>

      <div className="mx-auto max-w-7xl px-4 py-6 sm:px-6">
        {/* Tabs */}
        <div className="mb-6 flex flex-wrap gap-2">
          {[
            {id:'overview',label:'Overview',icon:'LayoutDashboard'},
            {id:'customers',label:'All Customers',icon:'Users',count:customers.length},
            {id:'orders',label:'All Orders',icon:'ClipboardList',count:orders.length},
            {id:'admins',label:'Admins',icon:'Shield',count:admins.length},
          ].map(t=>(
            <button key={t.id} type="button" onClick={()=>setTab(t.id)}
              className="flex items-center gap-2 rounded-lg border px-3.5 py-2 text-sm font-medium transition-colors"
              style={{borderColor:'rgb(var(--navy-200))',background:tab===t.id?'rgb(var(--navy-900))':'rgb(var(--card-bg))',color:tab===t.id?'white':'rgb(var(--navy-700))',cursor:'pointer'}}>
              <Icon name={t.icon} size={15}/>{t.label}
              {t.count!==undefined&&<span className="rounded-full px-1.5 py-0.5 text-[10px] font-bold" style={{background:tab===t.id?'rgba(255,255,255,0.2)':'rgb(var(--navy-100))'}}>{t.count}</span>}
            </button>
          ))}
        </div>

        {loading?<Loading label="Loading platform data…"/>:(
          <Fragment>
            {tab==='overview'&&(
              <div className="space-y-6">
                <div className="grid grid-cols-2 gap-3.5 sm:grid-cols-3 xl:grid-cols-5">
                  <Kpi label="Shops" value={stats.totalShops} icon="Store" color="#1d4ed8" bg="#dbeafe"/>
                  <Kpi label="Total Customers" value={stats.totalCustomers} icon="Users" color="#102a43" bg="#d9e2ec"/>
                  <Kpi label="Total Orders" value={stats.totalOrders} icon="ClipboardList" color="#7e22ce" bg="#f3e8ff"/>
                  <Kpi label="Revenue Collected" value={fmtC(stats.totalRevenue)} icon="Wallet" color="#059669" bg="#d1fae5"/>
                  <Kpi label="Pending Amount" value={fmtC(stats.pendingRevenue)} icon="AlertTriangle" color="#c2410c" bg="#ffedd5"/>
                </div>

                <div className="grid gap-5 lg:grid-cols-2">
                  <div className="card">
                    <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Recent Customers (all shops)</h3>
                    {customers.length===0?<p className="mt-3 text-sm" style={{color:'rgb(var(--navy-500))'}}>No customers registered yet.</p>:(
                      <div className="mt-3 space-y-2 max-h-96 overflow-y-auto">
                        {customers.slice(0,15).map(c=>(
                          <div key={c.id} className="flex items-center gap-3 rounded-lg border p-2.5" style={{borderColor:'rgb(var(--navy-200))'}}>
                            <div className="flex h-9 w-9 items-center justify-center rounded-full text-xs font-bold" style={{background:'rgb(var(--navy-100))',color:'rgb(var(--navy-600))'}}>{initials(c.name)}</div>
                            <div className="flex-1 min-w-0">
                              <p className="truncate text-sm font-medium" style={{color:'rgb(var(--navy-800))'}}>{c.name}</p>
                              <p className="text-xs" style={{color:'rgb(var(--navy-400))'}}>{c.phone}</p>
                            </div>
                            <span className="text-[10px]" style={{color:'rgb(var(--navy-400))'}}>{fmtD(c.created_at)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="card">
                    <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Recent Orders (all shops)</h3>
                    {orders.length===0?<p className="mt-3 text-sm" style={{color:'rgb(var(--navy-500))'}}>No orders yet.</p>:(
                      <div className="mt-3 space-y-2 max-h-96 overflow-y-auto">
                        {orders.slice(0,15).map(o=>{
                          const c=getCustomer(o.customer_id);
                          const bal=Number(o.price||0)-Number(o.advance||0);
                          return (
                            <div key={o.id} className="flex items-center gap-3 rounded-lg border p-2.5" style={{borderColor:'rgb(var(--navy-200))'}}>
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-2"><span className="text-xs font-bold" style={{color:'rgb(var(--navy-500))'}}>{o.order_code}</span><StatusBadge stage={o.stage}/></div>
                                <p className="mt-0.5 truncate text-sm font-medium" style={{color:'rgb(var(--navy-800))'}}>{c?c.name:'Unknown'} · {o.garment}</p>
                              </div>
                              <div className="text-right shrink-0">
                                <p className="text-xs font-bold" style={{color:'rgb(var(--navy-700))'}}>₹{o.price}</p>
                                {bal>0&&<p className="text-[10px]" style={{color:'#ea580c'}}>₹{bal} due</p>}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {tab==='customers'&&(
              <div className="space-y-4">
                <div className="max-w-md"><Search value={search} onChange={setSearch} placeholder="Search by name or phone…"/></div>
                {filteredCustomers.length===0?<Empty icon="Users" title={search?'No matches':'No customers registered yet'} description={search?'Try a different search.':'Once shops start adding customers, they will appear here.'}/>:(
                  <div className="overflow-x-auto rounded-xl border" style={{borderColor:'rgb(var(--navy-200))',background:'rgb(var(--card-bg))'}}>
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="border-b text-left text-[11px] font-semibold uppercase" style={{borderColor:'rgb(var(--navy-200))',color:'rgb(var(--navy-500))'}}>
                          <th className="px-4 py-3">Customer</th>
                          <th className="px-4 py-3">Phone</th>
                          <th className="px-4 py-3">Shop ID</th>
                          <th className="px-4 py-3">Orders</th>
                          <th className="px-4 py-3">Pending</th>
                          <th className="px-4 py-3">Joined</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredCustomers.map(c=>{
                          const cOrders=orders.filter(o=>o.customer_id===c.id);
                          const pending=cOrders.filter(o=>o.stage!=='Delivered').reduce((s,o)=>s+Math.max(0,o.price-o.advance),0);
                          return (
                            <tr key={c.id} className="border-b last:border-0" style={{borderColor:'rgb(var(--navy-100))'}}>
                              <td className="px-4 py-3">
                                <div className="flex items-center gap-3">
                                  <div className="flex h-8 w-8 items-center justify-center rounded-full text-xs font-bold" style={{background:'rgb(var(--navy-100))',color:'rgb(var(--navy-600))'}}>{initials(c.name)}</div>
                                  <span className="font-medium" style={{color:'rgb(var(--navy-800))'}}>{c.name}</span>
                                </div>
                              </td>
                              <td className="px-4 py-3" style={{color:'rgb(var(--navy-600))'}}>{c.phone}</td>
                              <td className="px-4 py-3 text-[11px]" style={{color:'rgb(var(--navy-400))'}}>{String(c.user_id||'').slice(0,8)||'—'}</td>
                              <td className="px-4 py-3" style={{color:'rgb(var(--navy-700))'}}>{cOrders.length}</td>
                              <td className="px-4 py-3 font-semibold" style={{color:pending>0?'#ea580c':'#059669'}}>{pending>0?fmtC(pending):'—'}</td>
                              <td className="px-4 py-3 text-xs" style={{color:'rgb(var(--navy-400))'}}>{fmtD(c.created_at)}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {tab==='orders'&&(
              <div className="space-y-4">
                <div className="max-w-md"><Search value={search} onChange={setSearch} placeholder="Search by order code or garment…"/></div>

                    <div><label className="label">Password</label><input value={newAdmin.p} onChange={e=>setNewAdmin(p=>({...p,p:e.target.value}))} placeholder="Min 3 chars" className="input"/></div>

                  <h3 className="text-sm font-bold" style={{color:'rgb(var(--navy-900))'}}>Platform Admins</h3>
                  <div className="mt-4 divide-y" style={{borderColor:'rgb(var(--navy-200))'}}>
                    {admins.map(a=>(
                      <div key={a.id||a.username} className="flex items-center gap-3 py-3">
                        <div className="flex h-10 w-10 items-center justify-center rounded-full text-sm font-bold" style={{background:'rgb(var(--gold-100))',color:'rgb(var(--gold-700))'}}>{initials(a.username)}</div>

                        {a.isDefault?<span className="badge" style={{background:'rgb(var(--gold-100))',color:'rgb(var(--gold-700))'}}><Icon name="Crown" size={11}/> Root</span>:(

      </div>

      <Confirm open={!!confirmDel} onClose={()=>setConfirmDel(null)} onConfirm={delAdmin} title="Remove admin?" message={'Remove "'+(confirmDel?confirmDel.username:'')+'"?'}/>

}

/* ============================================================ SHOP PAGES ============================================================ */
function Dashboard({customers,orders,onNav}){
  const stats=useMemo(()=>{
    const today=todayStr();const in3=addDays(3);
    const active=orders.filter(o=>o.stage!=='Delivered');
    const pb=active.reduce((s,o)=>s+Math.max(0,o.price-o.advance),0);
    const sc={};STAGES.forEach(s=>sc[s]=orders.filter(o=>o.stage===s).length);
    const mk=new Date().toISOString().slice(0,7);
    const rev=orders.filter(o=>o.created_at&&o.created_at.slice(0,7)===mk).reduce((s,o)=>s+Number(o.advance||0),0);
    const comp=orders.filter(o=>o.stage==='Delivered'&&o.updated_at&&o.updated_at.slice(0,7)===mk).length;
    const urgent=active.filter(o=>o.delivery_date<=in3).sort((a,b)=>a.delivery_date.localeCompare(b.delivery_date)).slice(0,8);
    const rc=[...customers].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,5);
    return{
      totalCustomers:customers.length,totalOrders:orders.length,active:active.length,
      dueToday:active.filter(o=>o.delivery_date===today).length,
      dueSoon:active.filter(o=>o.delivery_date>today&&o.delivery_date<=in3).length,
      overdue:active.filter(o=>o.delivery_date<today).length,
      pendingBalance:pb,stageCounts:sc,revenue:rev,completed:comp,urgent,recentCustomers:rc,
    };
  },[customers,orders]);
  const getC=id=>customers.find(c=>c.id===id);
  return (
    <div className="space-y-6">
      <div className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h2 className="text-xl font-bold sm:text-2xl" style={{color:'rgb(var(--navy-900))'}}>{greeting()} 👋</h2>
          <p className="mt-1 text-sm" style={{color:'rgb(var(--navy-500))'}}>Here's today's tailoring overview.</p>
        </div>
        <div className="flex flex-wrap gap-2">
          <button type="button" onClick={()=>onNav({name:'customers',params:{new:1}})} className="btn-outline btn-sm" style={{cursor:'pointer'}}><Icon name="UserPlus" size={15}/> New Customer</button>
          <button type="button" onClick={()=>onNav({name:'order-new'})} className="btn-gold btn-sm" style={{cursor:'pointer'}}><Icon name="Plus" size={15}/> New Order</button>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3.5 sm:grid-cols-3 xl:grid-cols-6">
        <Kpi label="Total Customers" value={stats.totalCustomers} icon="Users" color="#102a43" bg="#d9e2ec"/>
        <Kpi label="Active Orders" value={stats.active} icon="ClipboardList" color="#1d4ed8" bg="#dbeafe"/>
        <Kpi label="Due Today" value={stats.dueToday} icon="CalendarClock" color="#c2410c" bg="#ffedd5"/>
        <Kpi label="Next 3 Days" value={stats.dueSoon} icon="Calendar" color="#b45309" bg="#fef3c7"/>
        <Kpi label="Overdue" value={stats.overdue} icon="AlertTriangle" color="#b91c1c" bg="#fee2e2"/>
        <Kpi label="Pending Balance" value={fmtC(stats.pendingBalance)} icon="Wallet" color="#047857" bg="#d1fae5"/>
      </div>

      <div className="grid gap-5 lg:grid-cols-3">
        <div className="card lg:col-span-2">
          <div className="flex items-center justify-between">
            <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Order Status Overview</h3>
            <button type="button" onClick={()=>onNav({name:'orders'})} className="flex items-center gap-1 text-xs font-medium" style={{color:'rgb(var(--gold-600))',cursor:'pointer'}}>View board <Icon name="ArrowRight" size={13}/></button>
          </div>
          <div className="mt-4 grid grid-cols-5 gap-2">
            {STAGES.map(s=>{
              const c=STAGE_STYLES[s];
              return (
                <button key={s} type="button" onClick={()=>onNav({name:'orders',params:{stage:s}})}
                  className="rounded-xl border p-2.5 text-center sm:p-3 transition-all hover:-translate-y-0.5"
                  style={{background:c.bg,borderColor:c.bg,cursor:'pointer'}}>
                  <div className="mx-auto mb-2 h-1.5 w-6 rounded-full" style={{background:c.dot}}/>
                  <p className="text-lg font-bold sm:text-xl" style={{color:'rgb(var(--navy-900))'}}>{stats.stageCounts[s]||0}</p>
                  <p className="mt-0.5 text-[10px] font-semibold sm:text-[11px]" style={{color:c.text}}>{s}</p>
                </button>
              );
            })}
          </div>
        </div>

        <div className="card">
          <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>This Month</h3>
          <div className="mt-4 space-y-2.5">
            <div className="flex items-center gap-2.5 rounded-lg px-3.5 py-3" style={{background:'#ecfdf5'}}>
              <div className="flex h-9 w-9 items-center justify-center rounded-lg" style={{background:'#d1fae5',color:'#059669'}}><Icon name="TrendingUp" size={17}/></div>
              <div><p className="text-[11px] font-medium" style={{color:'#047857'}}>Revenue collected</p><p className="text-sm font-bold" style={{color:'#065f46'}}>{fmtC(stats.revenue)}</p></div>
            </div>
            <div className="flex items-center gap-2.5 rounded-lg px-3.5 py-3" style={{background:'rgb(var(--navy-100))'}}>
              <div className="flex h-9 w-9 items-center justify-center rounded-lg" style={{background:'rgb(var(--navy-200))'}}><Icon name="ClipboardList" size={17}/></div>
              <div><p className="text-[11px] font-medium" style={{color:'rgb(var(--navy-500))'}}>Orders completed</p><p className="text-sm font-bold" style={{color:'rgb(var(--navy-800))'}}>{stats.completed}</p></div>
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="flex items-center justify-between">
          <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Today's & Urgent Orders</h3>
          <button type="button" onClick={()=>onNav({name:'orders'})} className="flex items-center gap-1 text-xs font-medium" style={{color:'rgb(var(--gold-600))',cursor:'pointer'}}>All orders <Icon name="ArrowRight" size={13}/></button>
        </div>
        {stats.urgent.length===0?<div className="mt-4"><Empty icon="CheckCircle2" title="No urgent orders" description="You're all caught up."/></div>:(
          <div className="mt-4 space-y-2">
            {stats.urgent.map(o=>{
              const c=getC(o.customer_id);const due=dueInfo(o.delivery_date,o.stage);const bal=o.price-o.advance;
              const rb={overdue:{background:'#fef2f2',borderColor:'#fecaca'},today:{background:'#fffbeb',borderColor:'#fde68a'},soon:{background:'#fff7ed',borderColor:'#fed7aa'},future:{background:'rgb(var(--card-bg))',borderColor:'rgb(var(--navy-200))'},done:{background:'#ecfdf5',borderColor:'#a7f3d0'}};
              return (
                <button key={o.id} type="button" onClick={()=>onNav({name:'order',params:{id:o.id}})}
                  className="flex w-full items-center gap-3 rounded-xl border px-3.5 py-3 text-left"
                  style={{...rb[due.severity],cursor:'pointer'}}>
                  <div className="h-9 w-1 rounded-full" style={{background:due.severity==='overdue'?'#ef4444':due.severity==='today'?'#f59e0b':due.severity==='soon'?'#fb923c':'#9fb3c8'}}/>
                  <div className="flex-1 min-w-0">
                    <div className="flex flex-wrap items-center gap-2"><span className="text-xs font-bold" style={{color:'rgb(var(--navy-500))'}}>{o.order_code}</span><DueBadge due={due}/></div>
                    <p className="mt-0.5 truncate text-sm font-semibold" style={{color:'rgb(var(--navy-900))'}}>{c?.name||'Unknown'}</p>
                    <p className="text-xs" style={{color:'rgb(var(--navy-500))'}}>{o.garment} · {fmtD(o.delivery_date)}</p>
                  </div>
                  <div className="shrink-0 text-right">
                    <p className={'text-sm font-bold '+(bal>0?'text-orange-600':'text-emerald-600')}>{bal>0?fmtC(bal):'Paid'}</p>
                    <StatusBadge stage={o.stage}/>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div className="grid gap-5 lg:grid-cols-3">
        <div className="card lg:col-span-2">
          <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Recent Customers</h3>
          {stats.recentCustomers.length===0?<div className="mt-3"><Empty icon="Users" title="No customers yet"/></div>:(
            <div className="mt-3 space-y-2">
              {stats.recentCustomers.map(c=>(
                <button key={c.id} type="button" onClick={()=>onNav({name:'customer',params:{id:c.id}})}
                  className="flex w-full items-center gap-3 rounded-lg px-2 py-2.5 text-left hover:opacity-80" style={{cursor:'pointer'}}>
                  <div className="flex h-9 w-9 items-center justify-center rounded-full text-xs font-semibold" style={{background:'rgb(var(--navy-100))',color:'rgb(var(--navy-600))'}}>{initials(c.name)}</div>
                  <div className="flex-1 min-w-0">
                    <p className="truncate text-sm font-medium" style={{color:'rgb(var(--navy-800))'}}>{c.name}</p>
                    <p className="text-xs" style={{color:'rgb(var(--navy-400))'}}>{c.phone}</p>
                  </div>
                  <Icon name="ChevronRight" size={15}/>
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="card">
          <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Quick Actions</h3>
          <div className="mt-3 space-y-2">
            {[
              {l:'New Customer',i:'UserPlus',n:{name:'customers',params:{new:1}}},
              {l:'New Order',i:'Plus',n:{name:'order-new'}},
              {l:'Orders Board',i:'ClipboardList',n:{name:'orders'}},
              {l:'Pending Payments',i:'Wallet',n:{name:'payments'}},
            ].map(a=>(
              <button key={a.l} type="button" onClick={()=>onNav(a.n)}
                className="flex w-full items-center gap-3 rounded-lg border px-3.5 py-2.5 text-left text-sm font-medium"
                style={{borderColor:'rgb(var(--navy-200))',color:'rgb(var(--navy-700))',cursor:'pointer'}}>
                <div className="flex h-8 w-8 items-center justify-center rounded-lg" style={{background:'rgb(var(--navy-100))'}}><Icon name={a.i} size={16}/></div>
                {a.l}

        </div>
      </div>
    </div>
  );

/* Customers List */
function Customers({customers,orders,onCreate,onUpdate,onDelete,onNav,toast,rp,clearRp}){
  const [search,setSearch]=useState('');
  const [open,setOpen]=useState(false);
  const [editing,setEditing]=useState(null);
  const [del,setDel]=useState(null);
  useEffect(()=>{if(rp?.new===1){setEditing(null);setOpen(true);clearRp&&clearRp();}},[rp]);
  const enriched=useMemo(()=>{
    const q=search.toLowerCase().trim();
    const list=!q?customers:customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
    return list.map(c=>{
      const o=orders.filter(x=>x.customer_id===c.id);
      const pb=o.filter(x=>x.stage!=='Delivered').reduce((s,x)=>s+Math.max(0,x.price-x.advance),0);
      const last=o.length?o.map(x=>x.created_at).sort().slice(-1)[0]:null;
      return{...c,order_count:o.length,pending_balance:pb,last_order:last};
    });
  },[customers,orders,search]);
  const save=async d=>{try{if(editing){await onUpdate(editing.id,d);toast.success('Updated.');}else{await onCreate(d);toast.success(d.name+' added.');}setOpen(false);setEditing(null);}catch(e){toast.error(e.message);}};
  const remove=async()=>{if(!del)return;try{await onDelete(del.id);toast.success(del.name+' removed.');setDel(null);}catch(e){toast.error(e.message);}};
  return (
    <div className="space-y-5">
      <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div><h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Customers</h2><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>{customers.length} customer{customers.length!==1?'s':''}</p></div>
        <button type="button" onClick={()=>{setEditing(null);setOpen(true);}} className="btn-gold btn-sm" style={{cursor:'pointer'}}><Icon name="UserPlus" size={15}/> Add Customer</button>
      </div>
      <div className="max-w-md"><Search value={search} onChange={setSearch} placeholder="Search by name or phone…"/></div>
      {enriched.length===0?<Empty icon="Users" title={search?'No customers found':'No customers yet'} description={search?'Try a different search.':'Add your first customer to start creating orders.'} action={!search&&<button type="button" onClick={()=>setOpen(true)} className="btn-gold btn-sm" style={{cursor:'pointer'}}><Icon name="UserPlus" size={14}/> Add Customer</button>}/>:(
        <div className="space-y-2.5">
          {enriched.map(c=>{
            const has=Object.values(c.measurements||{}).some(v=>v!==''&&v!=null);
            return (
              <div key={c.id} className="card flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <button type="button" onClick={()=>onNav({name:'customer',params:{id:c.id}})} className="flex items-center gap-3 text-left" style={{cursor:'pointer'}}>
                  <div className="flex h-10 w-10 items-center justify-center rounded-full text-sm font-semibold" style={{background:'rgb(var(--navy-100))',color:'rgb(var(--navy-600))'}}>{initials(c.name)}</div>
                  <div>
                    <p className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>{c.name}</p>
                    <p className="text-xs" style={{color:'rgb(var(--navy-500))'}}>{c.phone} · {c.order_count} orders · {has?'Measured':'No measurements'}</p>
                  </div>
                </button>
                <div className="flex items-center gap-2">
                  {c.pending_balance>0&&<span className="text-sm font-bold text-orange-600">{fmtC(c.pending_balance)}</span>}
                  <button type="button" onClick={()=>{setEditing(c);setOpen(true);}} className="rounded-lg p-2" style={{cursor:'pointer'}}><Icon name="Pencil" size={15}/></button>
                  <button type="button" onClick={()=>setDel(c)} className="rounded-lg p-2" style={{cursor:'pointer'}}><Icon name="Trash2" size={15}/></button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      <Modal open={open} onClose={()=>{setOpen(false);setEditing(null);}} title={editing?'Edit Customer':'Add New Customer'}>
        <CustomerForm initial={editing} onSubmit={save} onCancel={()=>{setOpen(false);setEditing(null);}}/>
      </Modal>
      <Confirm open={!!del} onClose={()=>setDel(null)} onConfirm={remove} title="Delete customer?" message={'Delete '+(del?del.name:'')+' and all their orders?'}/>
    </div>
  );
}

/* Orders Board */
function Board({customers,orders,onMove,onNav,toast,rp}){
  const [search,setSearch]=useState('');
  const [dueF,setDueF]=useState('all');
  const [dragged,setDragged]=useState(null);
  const [over,setOver]=useState(null);
  const sp=rp?.stage;
  const getC=id=>customers.find(c=>c.id===id);
  const filtered=useMemo(()=>{
    let l=[...orders];
    if(sp)l=l.filter(o=>o.stage===sp);
    if(dueF!=='all'){
      const t=todayStr();const in3=addDays(3);
      l=l.filter(o=>{
        if(o.stage==='Delivered')return false;
        if(dueF==='overdue')return o.delivery_date<t;
        if(dueF==='today')return o.delivery_date===t;
        if(dueF==='soon')return o.delivery_date>t&&o.delivery_date<=in3;
        return true;
      });
    }
    if(search.trim()){
      const q=search.toLowerCase().trim();
      l=l.filter(o=>{const c=getC(o.customer_id);return(c&&(c.name.toLowerCase().includes(q)||c.phone.includes(q)))||o.order_code.toLowerCase().includes(q);});
    }
    return l;
  },[orders,customers,search,dueF,sp]);
  const drop=async stage=>{
    if(!dragged)return;
    const o=orders.find(x=>x.id===dragged);
    if(!o||o.stage===stage){setOver(null);setDragged(null);return;}
    try{await onMove(o.id,stage);toast.success(o.order_code+' → '+stage);}catch(e){toast.error(e.message);}
    finally{setOver(null);setDragged(null);}
  };
  return (
    <div className="space-y-4">
      <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div><h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Orders Board</h2><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>Drag orders between stages.</p></div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="w-full sm:w-64"><Search value={search} onChange={setSearch} placeholder="Search…"/></div>
          <select value={dueF} onChange={e=>setDueF(e.target.value)} className="input" style={{width:'auto'}}>
            <option value="all">All</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="soon">Due soon</option>
          </select>
          <button type="button" onClick={()=>onNav({name:'order-new'})} className="btn-gold btn-sm" style={{cursor:'pointer'}}><Icon name="Plus" size={15}/> New</button>
        </div>
      </div>
      {orders.length===0?<Empty icon="ClipboardList" title="No orders yet" action={<button type="button" onClick={()=>onNav({name:'order-new'})} className="btn-gold btn-sm" style={{cursor:'pointer'}}><Icon name="Plus" size={14}/> Create Order</button>}/>:(
        <div className="kanban-scroll -mx-4 px-4 pb-3 sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
          <div className="flex gap-4" style={{minWidth:STAGES.length*288}}>
            {STAGES.map(s=>{
              const list=filtered.filter(o=>o.stage===s);
              const c=STAGE_STYLES[s];
              return (
                <div key={s} className="flex w-72 shrink-0 flex-col">
                  <div className="flex items-center justify-between rounded-t-xl border border-b-0 px-3.5 py-3" style={{background:c.bg,borderColor:c.bg}}>
                    <div className="flex items-center gap-2"><span className="h-2 w-2 rounded-full" style={{background:c.dot}}/><h3 className="text-xs font-bold uppercase" style={{color:c.text}}>{s}</h3></div>
                    <span className="rounded-full px-2 py-0.5 text-[11px] font-bold" style={{background:'rgba(255,255,255,0.7)',color:'rgb(var(--navy-600))'}}>{list.length}</span>
                  </div>
                  <div onDragOver={e=>{e.preventDefault();setOver(s);}} onDrop={e=>{e.preventDefault();drop(s);}}
                    className={'flex min-h-[200px] flex-1 flex-col gap-2.5 rounded-b-xl border border-t-0 p-2.5 '+(over===s?'drag-over':'')}
                    style={{borderColor:c.bg,background:'rgb(var(--navy-50))'}}>
                    {list.length===0?<div className="flex flex-1 items-center justify-center py-8"><p className="text-xs" style={{color:'rgb(var(--navy-400))'}}>No orders</p></div>:(
                      list.map(o=>{
                        const cust=getC(o.customer_id);const due=dueInfo(o.delivery_date,o.stage);const b=o.price-o.advance;
                        const bl={overdue:'#ef4444',today:'#f59e0b',soon:'#fb923c',future:'#9fb3c8',done:'#10b981'};
                        return (
                          <div key={o.id} draggable
                            onDragStart={e=>{e.dataTransfer.setData('text/plain',String(o.id));setDragged(o.id);}}
                            onDragEnd={()=>{setDragged(null);setOver(null);}}
                            onClick={()=>onNav({name:'order',params:{id:o.id}})}
                            className={'rounded-xl border p-3.5 shadow-sm '+(dragged===o.id?'dragging':'')}
                            style={{background:'rgb(var(--card-bg))',borderColor:'rgb(var(--navy-200))',borderLeftWidth:'4px',borderLeftColor:bl[due.severity],cursor:'pointer'}}>
                            <div className="flex items-center justify-between"><span className="text-[11px] font-bold" style={{color:'rgb(var(--navy-400))'}}>{o.order_code}</span><DueBadge due={due}/></div>
                            <p className="mt-2 truncate text-sm font-semibold" style={{color:'rgb(var(--navy-900))'}}>{cust?.name||'Unknown'}</p>
                            <p className="truncate text-xs" style={{color:'rgb(var(--navy-500))'}}>{o.garment}</p>
                            <div className="mt-3 flex items-center justify-between text-xs">
                              <span style={{color:'rgb(var(--navy-500))'}}>{fmtD(o.delivery_date)}</span>
                              <span className="font-semibold" style={{color:b>0?'#ea580c':'#059669'}}>{b>0?fmtC(b):'Paid'}</span>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

      {filled.length>0&&(
        <div className="card">
          <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Measurements</h3>
          <div className="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
            {filled.map(([k,v])=>{
              const f=MEASUREMENT_FIELDS.find(x=>x.key===k);
              return <div key={k} className="rounded-lg border px-3.5 py-2.5" style={{borderColor:'rgb(var(--navy-200))'}}><p className="text-[11px] uppercase" style={{color:'rgb(var(--navy-400))'}}>{f?f.label:k}</p><p className="mt-0.5 text-sm font-bold" style={{color:'rgb(var(--navy-800))'}}>{v}"</p></div>;
            })}
          </div>
        </div>
      )}
      <div className="card" style={{borderColor:'#fecaca',background:'#fef2f2'}}>
        <h3 className="text-sm font-semibold" style={{color:'#b91c1c'}}>Danger Zone</h3>
        <button type="button" onClick={()=>setDel(true)} className="btn-danger btn-sm mt-3" style={{cursor:'pointer'}}>Delete Order</button>
      </div>
      <Modal open={edit} onClose={()=>setEdit(false)} title="Edit Order" size="lg"><OrderForm customers={customers} initial={{...o,customer_id:o.customer_id}} onSubmit={upd} onCancel={()=>setEdit(false)} loading={busy}/></Modal>
      <Confirm open={del} onClose={()=>setDel(false)} onConfirm={rem} title="Delete order?" message={'Delete '+o.order_code+'?'}/>
    </div>
  );
}

/* Order Slip */
function Slip({customers,orders,onNav,oid}){
  const o=orders.find(x=>x.id===oid);
  if(!o)return <Empty icon="AlertTriangle" title="Not found"/>;
  const c=customers.find(x=>x.id===o.customer_id);
  const filled=Object.entries(c?.measurements||{}).filter(([,v])=>v!==''&&v!=null);
  const b=o.price-o.advance;
  return (
    <div className="space-y-5">
      <div className="no-print flex flex-wrap items-center justify-between gap-2">
        <button type="button" onClick={()=>onNav({name:'order',params:{id:o.id}})} className="btn-ghost btn-sm" style={{cursor:'pointer'}}><Icon name="ArrowLeft" size={15}/> Back</button>
        <button type="button" onClick={()=>window.print()} className="btn-primary btn-sm" style={{cursor:'pointer'}}><Icon name="Printer" size={15}/> Print / Save PDF</button>
      </div>
      <div className="mx-auto max-w-lg">
        <div className="print-area rounded-xl border p-6" style={{borderColor:'#bcccdc',background:'#fff',color:'#102a43'}}>
          <div className="flex items-center justify-between border-b-2 pb-4" style={{borderColor:'#102a43'}}>
            <div className="flex items-center gap-3">
              <div className="flex h-12 w-12 items-center justify-center rounded-xl" style={{background:'#102a43'}}><Icon name="Scissors" size={24} color="#e8a84e"/></div>
              <div><h1 className="text-lg font-bold">Tailor Order Manager</h1><p className="text-[11px]" style={{color:'#627d98'}}>Perfect Fit Tailors · Since 2010</p></div>
            </div>
            <div className="text-right text-[10px]" style={{color:'#627d98'}}><p>123 Main Road, Bengaluru</p><p>+91 98765 43210</p></div>
          </div>
          <div className="mt-4 flex justify-between text-xs">
            <div><p className="text-base font-bold">{o.order_code}</p><p className="mt-1" style={{color:'#627d98'}}>Order: {fmtD(o.created_at)}</p></div>
            <div className="text-right"><p style={{color:'#627d98'}}>Delivery</p><p className="mt-0.5 font-bold">{fmtD(o.delivery_date)}</p><p className="mt-1" style={{color:'#627d98'}}>Stage: {o.stage}</p></div>
          </div>
          <div className="mt-4 rounded-lg px-4 py-3" style={{background:'#f0f4f8'}}>
            <p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Customer</p>
            <p className="mt-0.5 text-sm font-bold">{c?.name}</p>
            <p className="text-xs" style={{color:'#486581'}}>{c?.phone}</p>
          </div>
          <div className="mt-4 grid grid-cols-2 gap-3 text-xs">
            <div className="rounded-lg border px-3.5 py-2.5" style={{borderColor:'#bcccdc'}}><p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Garment</p><p className="mt-0.5 font-bold">{o.garment}</p></div>
            <div className="rounded-lg border px-3.5 py-2.5" style={{borderColor:'#bcccdc'}}><p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Fabric</p><p className="mt-0.5 font-bold">{o.fabric||'Standard'}</p></div>
          </div>
          {filled.length>0&&(
            <div className="mt-4">
              <p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Measurements (inches)</p>
              <div className="mt-2 grid grid-cols-3 gap-x-4 gap-y-2">
                {filled.map(([k,v])=>{
                  const f=MEASUREMENT_FIELDS.find(x=>x.key===k);
                  return <div key={k} className="flex justify-between border-b border-dotted pb-1 text-xs" style={{borderColor:'#bcccdc'}}><span style={{color:'#627d98'}}>{f?f.label:k}</span><span className="font-bold">{v}"</span></div>;
                })}
              </div>
            </div>
          )}
          <div className="mt-5 rounded-lg border-2 p-4" style={{borderColor:'#102a43'}}>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div><p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Total</p><p className="mt-1 text-base font-bold">{fmtC(o.price)}</p></div>
              <div><p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Advance</p><p className="mt-1 text-base font-bold" style={{color:'#047857'}}>{fmtC(o.advance)}</p></div>
              <div><p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Balance</p><p className="mt-1 text-base font-bold" style={{color:b>0?'#ea580c':'#047857'}}>{fmtC(b)}</p></div>
            </div>
          </div>
          {o.notes&&<div className="mt-4 text-xs"><p className="text-[10px] uppercase" style={{color:'#829ab1'}}>Notes</p><p className="mt-1">{o.notes}</p></div>}
          <p className="mt-3 text-center text-[9px]" style={{color:'#9fb3c8'}}>Printed {fmtDT(new Date().toISOString())}</p>
        </div>
      </div>
    </div>
  );
}

/* Payments */
function Payments({customers,orders,onNav,toast}){
  const pending=useMemo(()=>orders.filter(o=>o.stage!=='Delivered'&&o.price-o.advance>0).sort((a,b)=>a.delivery_date.localeCompare(b.delivery_date)),[orders]);
  const total=pending.reduce((s,o)=>s+(o.price-o.advance),0);
  const getC=id=>customers.find(c=>c.id===id);
  return (
    <div className="space-y-5">
      <div><h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Pending Payments</h2><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>Outstanding balances.</p></div>
      <div className="card" style={{background:'rgb(var(--navy-900))',borderColor:'rgb(var(--navy-800))'}}>
        <div className="flex items-center justify-between">
          <div><p className="text-[11px] uppercase" style={{color:'rgb(var(--navy-400))'}}>Total Pending</p><p className="mt-2 text-3xl font-bold" style={{color:'rgb(var(--gold-400))'}}>{fmtC(total)}</p><p className="mt-1 text-xs" style={{color:'rgb(var(--navy-400))'}}>Across {pending.length} orders</p></div>
          <div className="flex h-14 w-14 items-center justify-center rounded-2xl" style={{background:'rgba(232,168,78,0.15)',color:'rgb(var(--gold-400))'}}><Icon name="Wallet" size={26}/></div>
        </div>
      </div>
      {pending.length===0?<Empty icon="IndianRupee" title="All payments collected"/>:(
        <div className="space-y-2.5">
          {pending.map(o=>{
            const c=getC(o.customer_id);const b=o.price-o.advance;
            const msg='Hi '+(c?.name||'')+', order '+o.order_code+' ready. Balance ₹'+b+'.';
            return (
              <div key={o.id} className="card flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <button type="button" onClick={()=>onNav({name:'order',params:{id:o.id}})} className="flex flex-1 items-center gap-3 text-left" style={{cursor:'pointer'}}>
                  <div className="flex h-10 w-10 items-center justify-center rounded-xl" style={{background:'#ffedd5',color:'#c2410c'}}><Icon name="IndianRupee" size={18}/></div>
                  <div className="min-w-0">
                    <div className="flex flex-wrap items-center gap-2"><span className="text-xs font-bold" style={{color:'rgb(var(--navy-500))'}}>{o.order_code}</span><StatusBadge stage={o.stage}/></div>
                    <p className="mt-0.5 truncate text-sm font-semibold" style={{color:'rgb(var(--navy-900))'}}>{c?.name}</p>
                  </div>
                </button>
                <div className="flex items-center justify-between gap-3 sm:justify-end">
                  <div className="text-right"><p className="text-xs" style={{color:'rgb(var(--navy-400))'}}>Balance</p><p className="text-lg font-bold text-orange-600">{fmtC(b)}</p></div>
                  <a href={waLink(c?.phone,msg)} target="_blank" rel="noreferrer" onClick={()=>toast.success('WhatsApp opened.')} className="btn-gold btn-sm"><Icon name="MessageCircle" size={14}/> Remind</a>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* Settings */
function Settings({user,shop,onLogout}){
  return (
    <div className="mx-auto max-w-2xl space-y-5">
      <h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Settings</h2>
      <div className="card">
        <div className="flex items-center gap-4">
          <div className="flex h-16 w-16 items-center justify-center rounded-2xl text-xl font-bold" style={{background:'rgb(var(--navy-900))',color:'rgb(var(--gold-400))'}}>{initials(shop||user?.email)}</div>
          <div><h3 className="text-base font-bold" style={{color:'rgb(var(--navy-900))'}}>{shop||'My Shop'}</h3><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>{user?.email}</p></div>
        </div>
      </div>
      <div className="card">
        <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Theme</h3>
        <p className="mt-1 text-xs" style={{color:'rgb(var(--navy-500))'}}>10 themes available.</p>
        <div className="mt-3"><ThemeSwitcher/></div>
      </div>

        <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Account</h3>
        <button type="button" onClick={onLogout} className="btn-outline btn-sm mt-3" style={{color:'#dc2626',cursor:'pointer'}}><Icon name="LogOut" size={15}/> Sign Out</button>
      </div>
