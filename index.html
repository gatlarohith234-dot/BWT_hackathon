<script>
  (function() {
    function showError(msg) {
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML =
        '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:#f0f4f8; font-family:Inter,system-ui,sans-serif;">' +
          '<div style="max-width:560px; background:#fff; border:1px solid #fecaca; border-radius:16px; padding:2rem; box-shadow:0 10px 30px rgba(0,0,0,.08);">' +
            '<h2 style="margin:0 0 1rem 0;font-size:18px;color:#dc2626;">Something went wrong</h2>' +
            '<pre style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:12px;color:#334e68;overflow:auto;max-height:240px;white-space:pre-wrap;word-break:break-word;">' + String(msg).replace(/</g,'&lt;') + '</pre>' +
          '</div>' +
        '</div>';
    }
    window.addEventListener('error', function(e) { showError((e.message || 'Unknown error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function(e) { showError('Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason))); });
  })();
</script>

/* ============================================================
   THEME SYSTEM
   ============================================================ */
const THEMES = [
  { id:'navy-gold',        name:'Navy Gold',      mode:'light', swatch:['#102a43','#d98e2b'] },
  { id:'ocean',            name:'Ocean',          mode:'light', swatch:['#3b82f6','#f59e0b'] },
  { id:'cream',            name:'Cream',          mode:'light', swatch:['#faf5e6','#c8823c'] },
  { id:'rose',             name:'Rose',           mode:'light', swatch:['#f43f5e','#fb7185'] },
  { id:'emerald',          name:'Emerald',        mode:'light', swatch:['#16a34a','#eab308'] },
  { id:'lavender',         name:'Lavender',       mode:'light', swatch:['#9333ea','#ec4899'] },
  { id:'midnight-purple',  name:'Midnight Purple',mode:'dark',  swatch:['#1a1a2e','#8b5cf6'] },
  { id:'forest',           name:'Forest',         mode:'dark',  swatch:['#142319','#22c55e'] },
  { id:'charcoal',         name:'Charcoal',       mode:'dark',  swatch:['#1e1e1e','#ea580c'] },
  { id:'slate-dark',       name:'Slate Dark',     mode:'dark',  swatch:['#1e293b','#38bdf8'] },
];

function applyTheme(id) {
  const theme = THEMES.find(t => t.id === id) || THEMES[0];
  document.documentElement.setAttribute('data-theme', theme.id);
  document.documentElement.setAttribute('data-dark', theme.mode === 'dark' ? '1' : '0');
  try { localStorage.setItem('tailor_theme', theme.id); } catch (e) {}
}

function ThemeSwitcher({ compact = false }) {
  const [open, setOpen] = useState(false);
  const [current, setCurrent] = useState(() => {
    try { return localStorage.getItem('tailor_theme') || 'navy-gold'; } catch (e) { return 'navy-gold'; }
  });
  const ref = useRef(null);

  useEffect(() => {
    applyTheme(current);
  }, [current]);

  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const pick = (id) => { setCurrent(id); setOpen(false); };
  const active = THEMES.find(t => t.id === current) || THEMES[0];

  return (
    <div ref={ref} className="relative">
      <button
        onClick={() => setOpen(!open)}
        className="flex items-center gap-2 rounded-lg border border-navy-200 bg-white px-3 py-2 text-sm font-medium text-navy-700 hover:bg-navy-100 transition-colors"
        title="Change theme"
      >
        <Icon name="Palette" size={16} />
        {!compact && <span className="hidden sm:inline">{active.name}</span>}
        <div className="flex -space-x-1">
          <span className="h-3 w-3 rounded-full border border-white" style={{ background: active.swatch[0] }} />
          <span className="h-3 w-3 rounded-full border border-white" style={{ background: active.swatch[1] }} />
        </div>
      </button>
      {open && (
        <div className="absolute right-0 z-40 mt-2 w-64 overflow-hidden rounded-xl border border-navy-200 bg-white py-2 shadow-elevated anim-in">
          <p className="px-3.5 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-navy-400">Choose a theme</p>
          {THEMES.map(t => (
            <button
              key={t.id}
              onClick={() => pick(t.id)}
              className="flex w-full items-center gap-3 px-3.5 py-2 text-left text-sm text-navy-700 transition-colors hover:bg-navy-50"
            >
              <div className="flex -space-x-1.5">
                <span className="h-5 w-5 rounded-full border-2 border-white shadow-soft" style={{ background: t.swatch[0] }} />
                <span className="h-5 w-5 rounded-full border-2 border-white shadow-soft" style={{ background: t.swatch[1] }} />
              </div>
              <span className="flex-1 font-medium">{t.name}</span>
              {t.mode === 'dark' && <Icon name="Moon" size={13} className="text-navy-400" />}
              {t.mode === 'light' && <Icon name="Sun" size={13} className="text-navy-400" />}
              {t.id === current && <Icon name="Check" size={14} className="text-gold-500" />}
            </button>
          ))}

/* ============================================================
   ICON
   ============================================================ */
function Icon({ name, size = 16, className = '', strokeWidth = 2 }) {
  const lib = window.lucide && (window.lucide.icons || window.lucide);
  if (!lib) return <span style={{ display:'inline-block', width:size, height:size }} />;
  const node = lib[name] || lib[name.charAt(0).toUpperCase() + name.slice(1)];
  if (!node) return <span style={{ display:'inline-block', width:size, height:size }} />;
  if (Array.isArray(node)) {
    const children = node[2] || [];
    try {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth={strokeWidth}
          strokeLinecap="round" strokeLinejoin="round" className={className}>
          {children.map((c, i) => React.createElement(c[0], { key: i, ...(c[1] || {}) }))}
        </svg>
      );
    } catch (e) { return <span style={{ display:'inline-block', width:size, height:size }} />; }
  }
  return <span style={{ display:'inline-block', width:size, height:size }} />;
}

/* ============================================================
   HELPERS
   ============================================================ */
function formatCurrency(v) { return '₹' + (Number(v) || 0).toLocaleString('en-IN', { maximumFractionDigits:0 }); }
function formatDate(d) {
  if (!d) return '—';
  const dt = typeof d === 'string' && d.length === 10 ? new Date(d + 'T00:00:00') : new Date(d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function formatDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function todayStr() { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString().split('T')[0]; }
function addDaysStr(n) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0]; }
function initials(name) { if (!name) return '?'; return name.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase(); }
function greeting() { const h = new Date().getHours(); if (h < 12) return 'Good Morning'; if (h < 17) return 'Good Afternoon'; return 'Good Evening'; }
function getDueInfo(deliveryDate, stage) {
  if (stage === 'Delivered') return { label:'Delivered', color:'green', severity:'done' };
  if (!deliveryDate) return { label:'No date', color:'slate', severity:'future' };
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(deliveryDate + 'T00:00:00');
  const diff = Math.ceil((due - today) / 86400000);
  if (diff < 0) return { label:'Overdue ' + Math.abs(diff) + 'd', color:'red', severity:'overdue', days:Math.abs(diff) };
  if (diff === 0) return { label:'Due Today', color:'amber', severity:'today', days:0 };
  if (diff <= 3) return { label:'Due in ' + diff + 'd', color:'orange', severity:'soon', days:diff };
  return { label:'Due in ' + diff + 'd', color:'slate', severity:'future', days:diff };
}
function buildWhatsAppLink(phone, message) {
  const clean = String(phone || '').replace(/\D/g, '');
  const full = clean.length === 10 ? '91' + clean : clean;
  return 'https://wa.me/' + full + '?text=' + encodeURIComponent(message);
}

function MeasurementForm({ initial = {}, onSubmit, onCancel, loading }) {
  const [values, setValues] = useState(() => {
    const base = {};
    MEASUREMENT_FIELDS.forEach(f => { base[f.key] = initial[f.key] !== undefined ? initial[f.key] : ''; });
    Object.keys(initial).forEach(k => { if (!MEASUREMENT_FIELDS.find(f => f.key === k)) base[k] = initial[k]; });
    return base;
  });
  const [customFields, setCustomFields] = useState(() => Object.keys(initial).filter(k => !MEASUREMENT_FIELDS.find(f => f.key === k)));
  const [newField, setNewField] = useState('');
  const [errors, setErrors] = useState({});
  const update = (k, v) => setValues(p => Object.assign({}, p, { [k]: v.replace(/[^0-9.]/g, '') }));
  const validate = () => {
    const e = {};
    Object.entries(values).forEach(([k, v]) => { if (v !== '' && v != null) { const n = Number(v); if (isNaN(n) || n < 0 || n > 100) e[k] = 'Enter 0–100'; } });
    setErrors(e); return Object.keys(e).length === 0;
  };
  const submit = (ev) => { ev.preventDefault(); if (!validate()) return; const c = {}; Object.entries(values).forEach(([k, v]) => { if (v !== '' && v != null) c[k] = Number(v); }); onSubmit(c); };
  const addCustom = () => { const key = newField.trim().toLowerCase().replace(/\s+/g, '_'); if (!key || values[key] !== undefined) return; setCustomFields(p => [...p, key]); setValues(p => Object.assign({}, p, { [key]: '' })); setNewField(''); };
  const removeCustom = (key) => { setCustomFields(p => p.filter(k => k !== key)); setValues(p => { const n = Object.assign({}, p); delete n[key]; return n; }); };
  return (
    <form onSubmit={submit} className="space-y-5">
      <div className="flex items-center gap-2 rounded-lg bg-gold-50 px-3.5 py-2.5 text-xs font-medium text-gold-700 ring-1 ring-gold-200/60">
        <Icon name="Ruler" size={14} /> All measurements are in inches. Leave blank any that don't apply.
      </div>
      <div className="grid grid-cols-2 gap-4 sm:grid-cols-3">
        {MEASUREMENT_FIELDS.map(f => (
          <div key={f.key}>
            <label className="label">{f.label}</label>
            <input value={values[f.key] !== undefined ? values[f.key] : ''} onChange={(e) => update(f.key, e.target.value)} placeholder="0" inputMode="decimal" className={'input ' + (errors[f.key] ? 'border-red-400' : '')} />
            {errors[f.key] && <p className="mt-1 text-[11px] text-red-600">{errors[f.key]}</p>}
          </div>
        ))}
      </div>
      {customFields.length > 0 && (
        <div className="grid grid-cols-2 gap-4 border-t border-navy-100 pt-4 sm:grid-cols-3">
          {customFields.map(key => (
            <div key={key} className="relative">
              <label className="label capitalize">{key.replace(/_/g, ' ')}</label>
              <input value={values[key] !== undefined ? values[key] : ''} onChange={(e) => update(key, e.target.value)} placeholder="0" inputMode="decimal" className="input pr-9" />
              <button type="button" onClick={() => removeCustom(key)} className="absolute right-2 top-8 rounded-md p-1 text-navy-400 hover:bg-red-50 hover:text-red-600"><Icon name="X" size={13} /></button>
            </div>
          ))}
        </div>
      )}
      <div className="flex items-center gap-2">
        <input value={newField} onChange={(e) => setNewField(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && (e.preventDefault(), addCustom())} placeholder="Add custom measurement…" className="input flex-1" />
        <button type="button" onClick={addCustom} className="btn-outline shrink-0"><Icon name="Plus" size={15} /> Add</button>
      </div>
      <div className="flex justify-end gap-2 border-t border-navy-100 pt-4">
        <button type="button" onClick={onCancel} className="btn-outline" disabled={loading}>Cancel</button>

  );
}

/* ============================================================
   PORTAL CHOICE PAGE — small wrapper for landing → admin/shop
   ============================================================ */
function PortalChoice({ mode, onBack, onLogin, onSignup, loading }) {
  const isAdmin = mode === 'admin';
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [shopName, setShopName] = useState('');
  const [mode2, setMode2] = useState('login');
  const [showPw, setShowPw] = useState(false);
  const [infoMsg, setInfoMsg] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    setInfoMsg('');
    if (isAdmin) {
      if (!email || !password) { setInfoMsg('Please enter username and password.'); return; }
      try {
        await onLogin(email, password);
      } catch (err) { setInfoMsg(err.message || 'Invalid credentials.'); }
      return;
    }
    if (mode2 === 'signup' && !shopName.trim()) { setInfoMsg('Please enter your shop name.'); return; }
    if (!email || !password) { setInfoMsg('Please enter both email and password.'); return; }
    if (password.length < 6) { setInfoMsg('Password must be at least 6 characters.'); return; }
    try {
      if (mode2 === 'signup') await onSignup(email, password, shopName.trim());
      else await onLogin(email, password);
    } catch (err) { setInfoMsg(err.message || 'Something went wrong.'); }
  };

  return (
    <div className="flex min-h-screen bg-navy-950">
      <div className="relative hidden w-1/2 flex-col justify-between overflow-hidden bg-navy-950 p-12 lg:flex">
        <div className="absolute inset-0 opacity-[0.04]" style={{ backgroundImage:'radial-gradient(circle at 1px 1px, white 1px, transparent 0)', backgroundSize:'32px 32px' }} />
        <div className="absolute -bottom-32 -left-32 h-96 w-96 rounded-full bg-gold-500/10 blur-3xl" />

        <button onClick={onBack} className="relative flex items-center gap-2 text-sm text-navy-400 hover:text-white transition-colors">
          <Icon name="ArrowLeft" size={16} /> Back to home
        </button>

        <div className="relative">
          <div className="flex items-center gap-3">
            <div className="flex h-12 w-12 items-center justify-center rounded-xl bg-gold-500/15 ring-1 ring-gold-500/30">
              <Icon name={isAdmin ? 'Shield' : 'Store'} size={24} className="text-gold-400" />
            </div>
            <div>
              <h2 className="text-lg font-semibold text-white">{isAdmin ? 'Admin Portal' : 'Shop Portal'}</h2>
              <p className="text-xs text-navy-400">{isAdmin ? 'Platform management' : 'Manage your tailoring business'}</p>
            </div>
          </div>
          <h3 className="mt-8 text-3xl font-bold leading-tight text-white">
            {isAdmin ? 'Platform administration.' : 'Your shop, perfectly managed.'}
          </h3>
          <p className="mt-4 max-w-md text-sm leading-relaxed text-navy-400">
            {isAdmin
              ? 'Manage platform admins, oversee shops, and control access from a single dashboard.'
              : 'Sign up free and start adding customers, orders, and payments today. Syncs live across all your devices.'}
          </p>
        </div>

        <p className="relative text-[11px] text-navy-600">© 2026 Tailor Order Manager</p>
      </div>

      <div className="flex w-full items-center justify-center bg-navy-50 p-6 lg:w-1/2">
        <div className="w-full max-w-sm">
          <div className="mb-4 flex items-center justify-between">
            <button onClick={onBack} className="flex items-center gap-1.5 text-xs text-navy-500 hover:text-navy-800 lg:hidden">
              <Icon name="ArrowLeft" size={14} /> Back
            </button>
            <ThemeSwitcher compact />
          </div>

          {!isAdmin && (
            <div className="mb-5 flex rounded-xl bg-navy-100 p-1">
              <button onClick={() => { setMode2('login'); setInfoMsg(''); }} className={'flex-1 rounded-lg px-3 py-2 text-sm font-medium transition-all ' + (mode2 === 'login' ? 'bg-white text-navy-900 shadow-soft' : 'text-navy-500 hover:text-navy-700')}>Log In</button>
              <button onClick={() => { setMode2('signup'); setInfoMsg(''); }} className={'flex-1 rounded-lg px-3 py-2 text-sm font-medium transition-all ' + (mode2 === 'signup' ? 'bg-white text-navy-900 shadow-soft' : 'text-navy-500 hover:text-navy-700')}>Sign Up</button>
            </div>
          )}

          <h2 className="text-2xl font-bold tracking-tight text-navy-900">
            {isAdmin ? 'Admin login' : mode2 === 'login' ? 'Welcome back' : 'Create your shop'}
          </h2>
          <p className="mt-1 text-sm text-navy-500">
            {isAdmin ? 'Sign in to manage platform admins.' : mode2 === 'login' ? 'Sign in to your shop.' : 'Free forever. No credit card.'}
          </p>

          <form onSubmit={submit} className="mt-7 space-y-4">
            {!isAdmin && mode2 === 'signup' && (
              <div>
                <label className="label">Shop Name</label>
                <input value={shopName} onChange={(e) => setShopName(e.target.value)} placeholder="Perfect Fit Tailors" className="input" />
              </div>
            )}
            <div>
              <label className="label">{isAdmin ? 'Username' : 'Email'}</label>
              <input
                type={isAdmin ? 'text' : 'email'}
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder={isAdmin ? 'admin' : 'you@example.com'}
                className="input"
                autoFocus
              />
            </div>
            <div>
              <label className="label">Password</label>
              <div className="relative">
                <input type={showPw ? 'text' : 'password'} value={password} onChange={(e) => setPassword(e.target.value)} placeholder={isAdmin ? '123' : 'At least 6 characters'} className="input pr-10" />
                <button type="button" onClick={() => setShowPw(!showPw)} className="absolute right-3 top-1/2 -translate-y-1/2 text-navy-400 hover:text-navy-600">
                  <Icon name={showPw ? 'EyeOff' : 'Eye'} size={15} />
                </button>
              </div>
            </div>

            {infoMsg && <div className="rounded-lg border border-red-200 bg-red-50 px-3.5 py-2.5 text-xs text-red-700">{infoMsg}</div>}

            <button type="submit" className="btn-primary w-full" disabled={loading}>
              {loading ? 'Please wait…' : isAdmin ? 'Sign In as Admin' : mode2 === 'login' ? 'Sign In' : 'Create Account'}
            </button>
          </form>

          {isAdmin && (
            <div className="mt-5 rounded-lg border border-gold-200 bg-gold-50 px-4 py-3 text-xs text-gold-800">
              <strong>Demo admin:</strong> username <code className="rounded bg-gold-100 px-1 py-0.5">admin</code>, password <code className="rounded bg-gold-100 px-1 py-0.5">123</code>
            </div>
          )}

          {!isAdmin && mode2 === 'signup' && (
            <p className="mt-4 text-center text-xs text-navy-400">
              You'll receive a confirmation email if enabled in Supabase.
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

function AdminDashboardPage({ adminUser, admins, onAdd, onDelete, onLogout, adminLoading, toast }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [addLoading, setAddLoading] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);

  const submitAdd = async (e) => {
    e.preventDefault();
    if (!username.trim() || !password.trim()) { toast.error('Username and password are required.'); return; }
    if (password.length < 3) { toast.error('Password must be at least 3 characters.'); return; }
    setAddLoading(true);
    try {
      await onAdd(username.trim(), password.trim());
      toast.success('Admin "' + username + '" added successfully.');
      setUsername(''); setPassword('');
    } catch (err) {
      toast.error(err.message || 'Unable to add admin.');
    } finally { setAddLoading(false); }
  };

  const handleDelete = async () => {
    if (!confirmDel) return;
    try {
      await onDelete(confirmDel.id);
      toast.success('Admin "' + confirmDel.username + '" removed.');
      setConfirmDel(null);
    } catch (err) { toast.error(err.message || 'Unable to remove admin.'); }
  };

  return (
    <div className="min-h-screen bg-navy-50">
      <header className="border-b border-navy-200 bg-white">
        <div className="mx-auto flex max-w-5xl items-center justify-between px-4 py-4 sm:px-6">
          <div className="flex items-center gap-3">
            <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-navy-900">
              <Icon name="Shield" size={20} className="text-gold-400" />
            </div>
            <div>
              <h1 className="text-sm font-bold tracking-tight text-navy-900">Admin Portal</h1>
              <p className="text-[11px] text-navy-500">Signed in as {adminUser}</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <ThemeSwitcher />
            <button onClick={onLogout} className="btn-outline btn-sm text-red-600 hover:bg-red-50 hover:border-red-300">
              <Icon name="LogOut" size={14} /> Sign Out
            </button>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-5xl px-4 py-8 sm:px-6">
        <div className="mb-6">
          <h2 className="text-xl font-bold tracking-tight text-navy-900">Platform Administration</h2>
          <p className="mt-1 text-sm text-navy-500">Manage who has admin access to the platform.</p>
        </div>

        <div className="grid gap-5 lg:grid-cols-3">
          <div className="card lg:col-span-1">
            <h3 className="text-sm font-bold text-navy-900">Add New Admin</h3>
            <p className="mt-1 text-xs text-navy-500">New admins can sign in with the credentials you set here.</p>
            <form onSubmit={submitAdd} className="mt-4 space-y-3">
              <div>
                <label className="label">Username</label>
                <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="e.g. manager1" className="input" autoFocus />
              </div>
              <div>
                <label className="label">Password</label>
                <input value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Min 3 characters" className="input" />
              </div>
              <button type="submit" className="btn-gold w-full" disabled={addLoading}>
                <Icon name="UserPlus" size={15} /> {addLoading ? 'Adding…' : 'Add Admin'}
              </button>
            </form>
          </div>

          <div className="card lg:col-span-2">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold text-navy-900">Platform Admins</h3>
              <span className="badge bg-navy-100 text-navy-600 border border-navy-200">
                {adminLoading ? '…' : admins.length + ' total'}
              </span>
            </div>

            {adminLoading ? (
              <LoadingSpinner label="Loading admins…" />
            ) : admins.length === 0 ? (
              <div className="mt-4">
                <EmptyState icon="Shield" title="No additional admins" description="Add your first extra admin on the left." />
              </div>
            ) : (
              <div className="mt-4 divide-y divide-navy-50">
                {admins.map(a => (
                  <div key={a.id || a.username} className="flex items-center gap-3 py-3">
                    <div className="flex h-10 w-10 items-center justify-center rounded-full bg-gold-100 text-sm font-bold text-gold-700">
                      {initials(a.username)}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="truncate text-sm font-semibold text-navy-800">{a.username}</p>
                      <p className="text-xs text-navy-400">
                        {a.isDefault ? 'Built-in admin · cannot be removed' : 'Added ' + formatDate(a.created_at)}
                      </p>
                    </div>
                    {a.isDefault ? (
                      <span className="badge bg-gold-100 text-gold-700 border border-gold-200">
                        <Icon name="Crown" size={11} /> Root
                      </span>
                    ) : (
                      <button onClick={() => setConfirmDel(a)} className="rounded-lg p-2 text-navy-400 hover:bg-red-50 hover:text-red-600" title="Remove admin">
                        <Icon name="Trash2" size={15} />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="mt-6 card border-gold-200 bg-gold-50/40">
          <div className="flex items-start gap-3">
            <Icon name="Info" size={18} className="mt-0.5 shrink-0 text-gold-600" />
            <div>
              <h3 className="text-sm font-bold text-gold-900">About the root admin</h3>
              <p className="mt-1 text-xs leading-relaxed text-gold-800">
                The built-in <strong>admin / 123</strong> account is hardcoded and cannot be removed.
                Additional admins you add here are stored in Supabase and can sign in with their own credentials.
                In a production system, you'd hash these passwords with bcrypt and use proper authentication.
              </p>
            </div>
          </div>
        </div>
      </main>

      <ConfirmDialog open={!!confirmDel} onClose={() => setConfirmDel(null)} onConfirm={handleDelete}
        title="Remove admin?" message={'Remove admin access for "' + (confirmDel ? confirmDel.username : '') + '"?'} confirmLabel="Remove" />
    </div>
  );
}

    const stageCounts = {}; STAGES.forEach(s => stageCounts[s] = orders.filter(o => o.stage === s).length);
    const monthKey = new Date().toISOString().slice(0, 7);
    const revenueThisMonth = orders.filter(o => o.created_at && o.created_at.slice(0,7) === monthKey).reduce((s, o) => s + Number(o.advance || 0), 0);
    const completedThisMonth = orders.filter(o => o.stage === 'Delivered' && o.updated_at && o.updated_at.slice(0,7) === monthKey).length;
    const urgent = active.filter(o => o.delivery_date <= in3).sort((a,b) => a.delivery_date.localeCompare(b.delivery_date)).slice(0, 8);
    const recentCustomers = [...customers].sort((a,b) => (b.created_at||'').localeCompare(a.created_at||'')).slice(0, 5);

function CustomersPage({ customers, orders, onCreate, onUpdate, onDelete, onNav, toast, routeParams, clearParams }) {
  const [search, setSearch] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [saving, setSaving] = useState(false);
  useEffect(() => { if (routeParams && routeParams.new === 1) { setEditing(null); setModalOpen(true); clearParams && clearParams(); } }, [routeParams]); // eslint-disable-line
  const enriched = useMemo(() => {
    const q = search.toLowerCase().trim();
    const list = !q ? customers : customers.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q));
    return list.map(c => {
      const cOrders = orders.filter(o => o.customer_id === c.id);
      const pendingBalance = cOrders.filter(o => o.stage !== 'Delivered').reduce((s, o) => s + Math.max(0, o.price - o.advance), 0);
      const lastOrder = cOrders.length ? cOrders.map(o => o.created_at).sort().slice(-1)[0] : null;
      return Object.assign({}, c, { order_count: cOrders.length, pending_balance: pendingBalance, last_order: lastOrder });
    });
  }, [customers, orders, search]);
  const handleSave = async (data) => {
    setSaving(true);
    try {
      if (editing) { await onUpdate(editing.id, data); toast.success(data.name + "'s details updated."); }
      else { await onCreate(data); toast.success(data.name + ' added to your customers.'); }
      setModalOpen(false); setEditing(null);
    } catch (err) { toast.error(err.message || 'Unable to save customer.'); } finally { setSaving(false); }
  };
  const handleDelete = async () => {
    if (!confirmDelete) return;
    try { await onDelete(confirmDelete.id); toast.success(confirmDelete.name + ' removed.'); setConfirmDelete(null); }
    catch (err) { toast.error(err.message || 'Unable to delete customer.'); }
  };
  return (
    <div className="space-y-5">
      <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div><h2 className="text-lg font-bold text-navy-900">Customers</h2><p className="text-sm text-navy-500">{customers.length} customer{customers.length !== 1 ? 's' : ''}</p></div>
        <button onClick={() => { setEditing(null); setModalOpen(true); }} className="btn-gold btn-sm self-start sm:self-auto"><Icon name="UserPlus" size={15} /> Add Customer</button>
      </div>
      <div className="max-w-md"><SearchBar value={search} onChange={setSearch} placeholder="Search by name or phone number…" /></div>
      {enriched.length === 0 ? (
        <EmptyState icon="Users" title={search ? 'No customers found' : 'No customers yet'} description={search ? 'No customers match "' + search + '".' : 'Add your first customer to start creating orders.'} action={!search && <button onClick={() => setModalOpen(true)} className="btn-gold btn-sm"><Icon name="UserPlus" size={14} /> Add Customer</button>} />
      ) : (
        <Fragment>
          <div className="hidden overflow-x-auto rounded-xl border border-navy-200 bg-white lg:block">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-navy-100 bg-navy-50/50 text-left text-[11px] font-semibold uppercase tracking-wider text-navy-500">
                  <th className="px-4 py-3">Customer</th><th className="px-4 py-3">Phone</th><th className="px-4 py-3">Measurements</th><th className="px-4 py-3 text-center">Orders</th><th className="px-4 py-3 text-right">Pending</th><th className="px-4 py-3">Last Order</th><th className="px-4 py-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-navy-50">
                {enriched.map(c => {
                  const hasMeas = Object.values(c.measurements || {}).some(v => v !== '' && v != null);
                  return (
                    <tr key={c.id} onClick={() => onNav({ name:'customer', params:{ id:c.id } })} className="cursor-pointer transition-colors hover:bg-navy-50/50">
                      <td className="px-4 py-3"><div className="flex items-center gap-3"><div className="flex h-9 w-9 items-center justify-center rounded-full bg-navy-100 text-xs font-semibold text-navy-600">{initials(c.name)}</div><div><p className="font-medium text-navy-800">{c.name}</p><p className="text-[11px] text-navy-400">#{c.id}</p></div></div></td>
                      <td className="px-4 py-3"><span className="inline-flex items-center gap-1.5 text-navy-600"><Icon name="Phone" size={12} className="text-navy-400" /> {c.phone}</span></td>
                      <td className="px-4 py-3"><span className={'badge ' + (hasMeas ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-navy-50 text-navy-500 border-navy-200')}>{hasMeas ? 'Recorded' : 'Not set'}</span></td>
                      <td className="px-4 py-3 text-center font-medium text-navy-700">{c.order_count}</td>
                      <td className={'px-4 py-3 text-right font-semibold ' + (c.pending_balance > 0 ? 'text-orange-600' : 'text-emerald-600')}>{c.pending_balance > 0 ? formatCurrency(c.pending_balance) : '—'}</td>
                      <td className="px-4 py-3 text-navy-500">{c.last_order ? formatDate(c.last_order) : '—'}</td>
                      <td className="px-4 py-3"><div className="flex items-center justify-end gap-1">
                        <button onClick={(e) => { e.stopPropagation(); onNav({ name:'customer', params:{ id:c.id } }); }} className="rounded-lg p-2 text-navy-400 hover:bg-navy-100 hover:text-navy-700"><Icon name="Eye" size={15} /></button>
                        <button onClick={(e) => { e.stopPropagation(); setEditing(c); setModalOpen(true); }} className="rounded-lg p-2 text-navy-400 hover:bg-navy-100 hover:text-navy-700"><Icon name="Pencil" size={15} /></button>
                        <button onClick={(e) => { e.stopPropagation(); setConfirmDelete(c); }} className="rounded-lg p-2 text-navy-400 hover:bg-red-50 hover:text-red-600"><Icon name="Trash2" size={15} /></button>
                      </div></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="space-y-2.5 lg:hidden">
            {enriched.map(c => {
              const hasMeas = Object.values(c.measurements || {}).some(v => v !== '' && v != null);
              return (
                <div key={c.id} className="rounded-xl border border-navy-200 bg-white p-3.5 shadow-soft">
                  <div className="flex items-start gap-3">
                    <button onClick={() => onNav({ name:'customer', params:{ id:c.id } })} className="flex flex-1 items-start gap-3 text-left min-w-0">
                      <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-navy-100 text-xs font-semibold text-navy-600">{initials(c.name)}</div>
                      <div className="min-w-0 flex-1">
                        <p className="truncate font-semibold text-navy-800">{c.name}</p>
                        <p className="text-xs text-navy-500">{c.phone}</p>
                        <div className="mt-1.5 flex flex-wrap items-center gap-1.5">
                          <span className={'badge ' + (hasMeas ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-navy-50 text-navy-500 border-navy-200')}>{hasMeas ? 'Measurements set' : 'No measurements'}</span>
                          <span className="badge bg-navy-50 text-navy-600 border-navy-200">{c.order_count} orders</span>
                        </div>
                      </div>
                    </button>
                    <div className="flex shrink-0 flex-col items-end gap-1.5">
                      {c.pending_balance > 0 && <span className="text-sm font-bold text-orange-600">{formatCurrency(c.pending_balance)}</span>}
                      <div className="flex gap-1">
                        <button onClick={() => { setEditing(c); setModalOpen(true); }} className="rounded-lg p-1.5 text-navy-400 hover:bg-navy-100 hover:text-navy-700"><Icon name="Pencil" size={14} /></button>
                        <button onClick={() => setConfirmDelete(c)} className="rounded-lg p-1.5 text-navy-400 hover:bg-red-50 hover:text-red-600"><Icon name="Trash2" size={14} /></button>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </Fragment>
      )}
      <Modal open={modalOpen} onClose={() => { setModalOpen(false); setEditing(null); }} title={editing ? 'Edit Customer' : 'Add New Customer'}>
        <CustomerForm initial={editing} onSubmit={handleSave} onCancel={() => { setModalOpen(false); setEditing(null); }} loading={saving} />
      </Modal>
      <ConfirmDialog open={!!confirmDelete} onClose={() => setConfirmDelete(null)} onConfirm={handleDelete} title="Delete customer?" message={'This will permanently delete ' + (confirmDelete ? confirmDelete.name : '') + ' and all their orders.'} />
    </div>
  );
}

function CustomerDetailPage({ customers, orders, onUpdate, onDelete, onNav, toast, customerId }) {
  const customer = customers.find(c => c.id === customerId);
  const [editOpen, setEditOpen] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  if (!customer) return <EmptyState icon="AlertTriangle" title="Customer not found" action={<button onClick={() => onNav({ name:'customers' })} className="btn-primary btn-sm">Back</button>} />;
  const customerOrders = orders.filter(o => o.customer_id === customerId).sort((a,b) => (b.created_at||'').localeCompare(a.created_at||''));
  const filledMeasurements = Object.entries(customer.measurements || {}).filter(([,v]) => v !== '' && v != null);

function OrdersBoardPage({ customers, orders, onMoveStage, onNav, toast, routeParams }) {
  const [search, setSearch] = useState('');
  const [dueFilter, setDueFilter] = useState('all');
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverStage, setDragOverStage] = useState(null);
  const stageParam = routeParams && routeParams.stage;
  const getCustomer = (id) => customers.find(c => c.id === id);
  const filtered = useMemo(() => {
    let list = [...orders];
    if (stageParam) list = list.filter(o => o.stage === stageParam);
    if (dueFilter !== 'all') {
      const today = todayStr(); const in3 = addDaysStr(3);
      list = list.filter(o => { if (o.stage === 'Delivered') return false; if (dueFilter === 'overdue') return o.delivery_date < today; if (dueFilter === 'today') return o.delivery_date === today; if (dueFilter === 'soon') return o.delivery_date > today && o.delivery_date <= in3; return true; });
    }
    if (search.trim()) {
      const q = search.toLowerCase().trim();
      list = list.filter(o => { const c = getCustomer(o.customer_id); return (c && (c.name.toLowerCase().includes(q) || c.phone.includes(q))) || o.order_code.toLowerCase().includes(q); });
    }
    return list;
  }, [orders, customers, search, dueFilter, stageParam]);
  const handleDrop = async (stage) => {
    if (!draggedId) return;
    const order = orders.find(o => o.id === draggedId);
    if (!order || order.stage === stage) { setDragOverStage(null); setDraggedId(null); return; }
    try { await onMoveStage(order.id, stage); toast.success(order.order_code + ' moved to ' + stage + '.'); }
    catch (err) { toast.error(err.message); } finally { setDragOverStage(null); setDraggedId(null); }
  };
  return (
    <div className="space-y-4">
      <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div><h2 className="text-lg font-bold text-navy-900">Orders Board</h2><p className="text-sm text-navy-500">Drag orders between stages to update progress.</p></div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="w-full sm:w-64"><SearchBar value={search} onChange={setSearch} placeholder="Search orders…" /></div>
          <select value={dueFilter} onChange={(e) => setDueFilter(e.target.value)} className="input !w-auto !py-2 text-sm">
            <option value="all">All orders</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="soon">Due soon (3 days)</option>
          </select>
          <button onClick={() => onNav({ name:'order-new' })} className="btn-gold btn-sm"><Icon name="Plus" size={15} /> New Order</button>
        </div>
      </div>
      {filtered.length === 0 && (search || dueFilter !== 'all' || stageParam) ? (
        <EmptyState icon="ClipboardList" title="No matching orders" description="Try adjusting your search or filter." />
      ) : orders.length === 0 ? (
        <EmptyState icon="ClipboardList" title="No orders yet" description="Create your first stitching order." action={<button onClick={() => onNav({ name:'order-new' })} className="btn-gold btn-sm"><Icon name="Plus" size={14} /> Create Order</button>} />
      ) : (
        <div className="kanban-scroll -mx-4 px-4 pb-3 sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
          <div className="flex gap-4" style={{ minWidth: STAGES.length * 288 }}>
            {STAGES.map(stage => {
              const stageOrders = filtered.filter(o => o.stage === stage);
              const c = STAGE_STYLES[stage]; const isOver = dragOverStage === stage;
              return (
                <div key={stage} className="flex w-72 shrink-0 flex-col sm:w-64 lg:w-72">
                  <div className={'flex items-center justify-between rounded-t-xl border border-b-0 px-3.5 py-3 ' + c.bg + ' ' + c.border}>
                    <div className="flex items-center gap-2"><span className={'h-2 w-2 rounded-full ' + c.dot} /><h3 className={'text-xs font-bold uppercase tracking-wider ' + c.text}>{stage}</h3></div>
                    <span className="rounded-full bg-white/70 px-2 py-0.5 text-[11px] font-bold text-navy-600">{stageOrders.length}</span>
                  </div>
                  <div onDragOver={(e) => { e.preventDefault(); setDragOverStage(stage); }} onDragLeave={() => setDragOverStage(prev => prev === stage ? null : prev)} onDrop={(e) => { e.preventDefault(); handleDrop(stage); }} className={'flex min-h-[200px] flex-1 flex-col gap-2.5 rounded-b-xl border border-t-0 p-2.5 transition-colors ' + c.border + ' ' + (isOver ? 'drag-over' : 'bg-navy-50/40')}>
                    {stageOrders.length === 0 ? (
                      <div className="flex flex-1 items-center justify-center py-8 text-center"><p className="text-xs text-navy-400">No orders</p></div>
                    ) : (
                      stageOrders.map(o => {
                        const customer = getCustomer(o.customer_id); const due = getDueInfo(o.delivery_date, o.stage); const bal = o.price - o.advance;
                        const borderLeft = { overdue:'border-l-red-500', today:'border-l-amber-500', soon:'border-l-orange-400', future:'border-l-navy-300', done:'border-l-emerald-500' };
                        return (
                          <div key={o.id} draggable onDragStart={(e) => { e.dataTransfer.setData('text/plain', String(o.id)); e.dataTransfer.effectAllowed = 'move'; setDraggedId(o.id); }} onDragEnd={() => { setDraggedId(null); setDragOverStage(null); }} onClick={() => onNav({ name:'order', params:{ id:o.id } })} className={'cursor-pointer rounded-xl border border-navy-200 bg-white p-3.5 shadow-soft transition-all hover:-translate-y-0.5 hover:shadow-card border-l-4 ' + borderLeft[due.severity] + ' ' + (draggedId === o.id ? 'dragging' : '')}>
                            <div className="flex items-center justify-between"><span className="text-[11px] font-bold tracking-wider text-navy-400">{o.order_code}</span><DueBadge due={due} /></div>
                            <p className="mt-2 truncate text-sm font-semibold text-navy-900">{(customer && customer.name) || 'Unknown'}</p>
                            <p className="truncate text-xs text-navy-500">{o.garment}{o.fabric ? ' · ' + o.fabric : ''}</p>
                            <div className="mt-3 flex items-center justify-between text-xs">
                              <span className="flex items-center gap-1 text-navy-500"><Icon name="Calendar" size={12} /> {formatDate(o.delivery_date)}</span>
                              <span className={'font-semibold ' + (bal > 0 ? 'text-orange-600' : 'text-emerald-600')}>{bal > 0 ? formatCurrency(bal) : 'Paid'}</span>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */
function App() {
  const [user, setUser] = useState(null);
  const [shopName, setShopName] = useState('');
  const [authLoading, setAuthLoading] = useState(true);
  const [customers, setCustomers] = useState([]);
  const [orders, setOrders] = useState([]);
  const [dataLoading, setDataLoading] = useState(false);
  const [route, setRoute] = useState({ name:'landing', params:{} });
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [routeParams, setRouteParams] = useState({});
  const [publicView, setPublicView] = useState('landing'); // 'landing' | 'admin' | 'shop'
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminUser, setAdminUser] = useState('');
  const [admins, setAdmins] = useState([]);
  const [adminLoading, setAdminLoading] = useState(false);

  const addToast = useCallback((message, type = 'success') => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4200);
  }, []);
  const removeToast = useCallback((id) => setToasts(prev => prev.filter(t => t.id !== id)), []);
  const toast = useMemo(() => ({ success: (m) => addToast(m, 'success'), error: (m) => addToast(m, 'error'), info: (m) => addToast(m, 'info') }), [addToast]);

  /* Auth */
  useEffect(() => {
    if (!supabase) { setAuthLoading(false); return; }
    let mounted = true;
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (!mounted) return;
      setUser(session ? session.user : null);
      setShopName(session && session.user && session.user.user_metadata ? session.user.user_metadata.shop_name || '' : '');
      setAuthLoading(false);
    }).catch(() => setAuthLoading(false));
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session ? session.user : null);
      setShopName(session && session.user && session.user.user_metadata ? session.user.user_metadata.shop_name || '' : '');
      if (!session) { setCustomers([]); setOrders([]); }
    });
    return () => { mounted = false; subscription.unsubscribe(); };
  }, []);

  /* Load shop data + realtime */
  useEffect(() => {
    if (!user || !supabase || isAdmin) return;
    let active = true;
    setDataLoading(true);
    (async () => {
      try {
        const [cRes, oRes] = await Promise.all([
          supabase.from('customers').select('*').order('created_at', { ascending: false }),
          supabase.from('orders').select('*').order('delivery_date', { ascending: true }),
        ]);
        if (!active) return;
        if (cRes.error) toast.error('Load failed: ' + cRes.error.message); else setCustomers(cRes.data || []);
        if (oRes.error) toast.error('Load failed: ' + oRes.error.message); else setOrders(oRes.data || []);
      } catch (e) { toast.error('Load failed: ' + e.message); }
      finally { if (active) setDataLoading(false); }
    })();
    const channel = supabase.channel('tailor-realtime')
      .on('postgres_changes', { event:'*', schema:'public', table:'customers' }, (payload) => {
        setCustomers(prev => {
          if (payload.eventType === 'INSERT') return [payload.new].concat(prev);
          if (payload.eventType === 'UPDATE') return prev.map(c => c.id === payload.new.id ? payload.new : c);
          if (payload.eventType === 'DELETE') return prev.filter(c => c.id !== payload.old.id);
          return prev;
        });
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, (payload) => {
        setOrders(prev => {
          if (payload.eventType === 'INSERT') return [payload.new].concat(prev);
          if (payload.eventType === 'UPDATE') return prev.map(o => o.id === payload.new.id ? payload.new : o);
          if (payload.eventType === 'DELETE') return prev.filter(o => o.id !== payload.old.id);
          return prev;
        });
      })
      .subscribe();
    return () => { active = false; try { supabase.removeChannel(channel); } catch (e) {} };
  }, [user, toast, isAdmin]);

  /* Load admins when in admin mode */
  const loadAdmins = useCallback(async () => {
    if (!supabase) return;
    setAdminLoading(true);
    try {
      const { data, error } = await supabase.from('platform_admins').select('*').order('created_at', { ascending: true });
      if (error) throw error;
      // Always include the hardcoded root admin as a special entry
      const rootAdmin = { id: 'root', username: 'admin', created_at: null, isDefault: true };
      const extras = (data || []).filter(a => a.username !== 'admin').map(a => Object.assign({}, a, { isDefault: false }));
      setAdmins([rootAdmin, ...extras]);
    } catch (err) {
      toast.error('Failed to load admins: ' + err.message);
      setAdmins([{ id: 'root', username: 'admin', isDefault: true }]);
    } finally { setAdminLoading(false); }
  }, [toast]);

  useEffect(() => {
    if (isAdmin) loadAdmins();
  }, [isAdmin, loadAdmins]);

  /* Realtime for admins */
  useEffect(() => {
    if (!isAdmin || !supabase) return;
    const channel = supabase.channel('admins-realtime')
      .on('postgres_changes', { event:'*', schema:'public', table:'platform_admins' }, () => loadAdmins())
      .subscribe();
    return () => { try { supabase.removeChannel(channel); } catch (e) {} };
  }, [isAdmin, loadAdmins]);

  /* Admin auth */
  const handleAdminLogin = async (username, password) => {
    const clean = String(username).trim().toLowerCase();
    // Check hardcoded root admin
    if (clean === 'admin' && password === '123') {
      setIsAdmin(true); setAdminUser('admin');
      toast.success('Welcome, admin.');
      return;
    }
    // Check platform_admins table
    if (!supabase) throw new Error('Supabase not configured.');
    const { data, error } = await supabase.from('platform_admins').select('*').eq('username', clean).eq('password', password).limit(1);
    if (error) throw new Error(error.message);
    if (!data || data.length === 0) throw new Error('Invalid username or password.');
    setIsAdmin(true); setAdminUser(clean);
    toast.success('Welcome, ' + clean + '.');
  };

  const handleAdminLogout = () => {
    setIsAdmin(false); setAdminUser(''); setAdmins([]);
    setPublicView('landing');
    toast.info('Signed out of admin portal.');
  };

  const handleAddAdmin = async (username, password) => {
    if (!supabase) throw new Error('Supabase not configured.');
    const clean = username.trim().toLowerCase();
    if (clean === 'admin') throw new Error('"admin" is reserved for the root account.');
    const { error } = await supabase.from('platform_admins').insert({ username: clean, password });
    if (error) {
      if (error.code === '23505') throw new Error('That username is already taken.');
      throw error;
    }
    await loadAdmins();
  };

  const handleDeleteAdmin = async (id) => {
    if (!supabase) throw new Error('Supabase not configured.');
    const { error } = await supabase.from('platform_admins').delete().eq('id', id);
    if (error) throw error;
    await loadAdmins();
  };

  /* Shop auth */
  const handleLogin = async (email, password) => {
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    toast.success('Welcome back!');
    setPublicView('shop');
  };

  const handleSignup = async (email, password, shop) => {
    const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { shop_name: shop } } });
    if (error) throw error;
    if (data && data.user && !data.session) toast.info('Check your email to confirm your account.');
    else if (data && data.session) { toast.success('Account created — welcome!'); setPublicView('shop'); }
  };

  const handleLogout = async () => {
    try { await supabase.auth.signOut(); } catch (e) {}
    setRoute({ name:'dashboard', params:{} });
    setPublicView('landing');
  };

  /* CRUD */
  const createCustomer = async (data) => {
    const { data: row, error } = await supabase.from('customers').insert({ name: data.name, phone: data.phone, measurements: {}, user_id: user.id }).select().single();
    if (error) throw error;
    return row;
  };
  const updateCustomer = async (id, data) => {
    const payload = Object.assign({}, data, { updated_at: new Date().toISOString() });
    const { error } = await supabase.from('customers').update(payload).eq('id', id);
    if (error) throw error;
  };
  const deleteCustomer = async (id) => {
    const { error } = await supabase.from('customers').delete().eq('id', id);
    if (error) throw error;
  };
  const createOrder = async (data, existingOrders) => {
    const nums = existingOrders.map(o => parseInt((o.order_code || 'ORD-1000').replace('ORD-', ''), 10)).filter(n => !isNaN(n));
    const next = (nums.length ? Math.max.apply(null, nums) : 1000) + 1;
    const { data: row, error } = await supabase.from('orders').insert({
      order_code: 'ORD-' + next, customer_id: Number(data.customer_id), user_id: user.id,
      garment: data.garment, fabric: data.fabric || '', price: Number(data.price),
      advance: Number(data.advance) || 0, delivery_date: data.delivery_date, stage: 'Received', notes: data.notes || '',
    }).select().single();
    if (error) throw error;
    return row;
  };
  const updateOrder = async (id, data) => {
    const { error } = await supabase.from('orders').update(Object.assign({}, data, { updated_at: new Date().toISOString() })).eq('id', id);
    if (error) throw error;
  };
  const moveOrderStage = async (id, stage) => {
    const { error } = await supabase.from('orders').update({ stage, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
  };
  const deleteOrder = async (id) => {
    const { error } = await supabase.from('orders').delete().eq('id', id);
    if (error) throw error;
  };

  const navigate = useCallback((r) => {
    if (typeof r === 'string') setRoute({ name:r, params:{} });
    else { const params = r.params; const rest = Object.assign({}, r); delete rest.params; setRoute(rest); setRouteParams(params || {}); }
    setSidebarOpen(false);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, []);

  /* Routing */
  if (!supabase) return <SetupScreen error={supabaseInitError} />;
  if (authLoading) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-navy-50">
        <div className="flex flex-col items-center gap-4">
          <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-navy-900"><Icon name="Scissors" size={26} className="text-gold-400" /></div>
          <div className="spinner" />
        </div>
      </div>
    );
  }

  const toastStack = (
    <div className="fixed bottom-4 right-4 z-[100] flex w-[calc(100%-2rem)] flex-col gap-2 no-print sm:w-96">
      {toasts.map(t => <Toast key={t.id} toast={t} onClose={() => removeToast(t.id)} />)}
    </div>
  );

  /* Admin mode */
  if (isAdmin) {
    return (
      <Fragment>
        <AdminDashboardPage
          adminUser={adminUser}
          admins={admins}
          onAdd={handleAddAdmin}
          onDelete={handleDeleteAdmin}
          onLogout={handleAdminLogout}
          adminLoading={adminLoading}
          toast={toast}
        />
        {toastStack}
      </Fragment>
    );
  }

  /* Public (not logged in) */
  if (!user) {
    if (publicView === 'landing') {
      return (
        <Fragment>
          <LandingPage onChooseAdmin={() => setPublicView('admin')} onChooseShop={() => setPublicView('shop')} />
          {toastStack}
        </Fragment>
      );
    }
    if (publicView === 'admin') {
      return (
        <Fragment>
          <PortalChoice mode="admin" onBack={() => setPublicView('landing')} onLogin={handleAdminLogin} onSignup={() => {}} loading={false} />
          {toastStack}
        </Fragment>
      );
    }
    return (
      <Fragment>
        <PortalChoice mode="shop" onBack={() => setPublicView('landing')} onLogin={handleLogin} onSignup={handleSignup} loading={false} />
        {toastStack}
      </Fragment>
    );
  }

  /* Shop dashboard */
  const titleMap = { dashboard:'Dashboard', customers:'Customers', customer:'Customer Profile', measurements:'Measurements', orders:'Orders Board', 'order-new':'New Order', order:'Order Details', 'order-slip':'Order Slip', payments:'Pending Payments', settings:'Settings' };

  const renderPage = () => {
    if (dataLoading) return <LoadingSpinner label="Loading your data…" />;
    switch (route.name) {
      case 'dashboard': return <DashboardPage customers={customers} orders={orders} onNav={navigate} />;
      case 'customers': return <CustomersPage customers={customers} orders={orders} onCreate={createCustomer} onUpdate={updateCustomer} onDelete={deleteCustomer} onNav={navigate} toast={toast} routeParams={routeParams} clearParams={() => setRouteParams({})} />;
      case 'customer': return <CustomerDetailPage customers={customers} orders={orders} onUpdate={updateCustomer} onDelete={deleteCustomer} onNav={navigate} toast={toast} customerId={Number(routeParams.id)} />;
      case 'measurements': return <MeasurementsPage customers={customers} onUpdate={updateCustomer} onNav={navigate} toast={toast} customerId={Number(routeParams.id)} />;
      case 'orders': return <OrdersBoardPage customers={customers} orders={orders} onMoveStage={moveOrderStage} onNav={navigate} toast={toast} routeParams={routeParams} />;
      case 'order-new': return <NewOrderPage customers={customers} orders={orders} onCreateOrder={createOrder} onNav={navigate} toast={toast} routeParams={routeParams} />;
      case 'order': return <OrderDetailPage customers={customers} orders={orders} onUpdateOrder={updateOrder} onMoveStage={moveOrderStage} onDeleteOrder={deleteOrder} onNav={navigate} toast={toast} orderId={Number(routeParams.id)} />;
      case 'order-slip': return <OrderSlipPage customers={customers} orders={orders} onNav={navigate} orderId={Number(routeParams.id)} />;
      case 'payments': return <PendingPaymentsPage customers={customers} orders={orders} onNav={navigate} toast={toast} />;
      case 'settings': return <SettingsPage user={user} shopName={shopName} onLogout={handleLogout} />;
      default: return <DashboardPage customers={customers} orders={orders} onNav={navigate} />;
    }
  };

  return (
    <div className="flex min-h-screen bg-navy-50">
      <Sidebar open={sidebarOpen} onClose={() => setSidebarOpen(false)} user={user} shopName={shopName} onLogout={handleLogout} route={route} onNav={navigate} />
      <div className="flex min-w-0 flex-1 flex-col">
        <Topbar onMenuClick={() => setSidebarOpen(true)} title={titleMap[route.name] || 'Tailor Order Manager'} />
        <main className="flex-1 px-4 py-5 sm:px-6 sm:py-6 lg:px-8">{renderPage()}</main>
      </div>
      {toastStack}
    </div>
  );
}

try {
  const rootEl = document.getElementById('root');
  if (rootEl) {
    rootEl.innerHTML = '';
    ReactDOM.createRoot(rootEl).render(<App />);
  }
} catch (e) {
  document.getElementById('root').innerHTML = '<div style="padding:2rem;font-family:sans-serif;color:#dc2626;"><h2>Mount failed</h2><pre>' + String(e && e.message ? e.message : e) + '</pre></div>';
}
</script>
</body>
</html>
