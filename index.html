}

/* ============================================================ MAIN APP ============================================================ */
function App(){
  const [user,setUser]=useState(null);
  const [shop,setShop]=useState('');
  const [authLoading,setAuthLoading]=useState(true);
  const [customers,setCustomers]=useState([]);
  const [orders,setOrders]=useState([]);
  const [dataLoading,setDataLoading]=useState(false);
  const [route,setRoute]=useState({name:'dashboard',params:{}});
  const [sidebar,setSidebar]=useState(false);
  const [toasts,setToasts]=useState([]);
  const [rp,setRp]=useState({});
  const [view,setView]=useState('landing');
  const [isAdmin,setIsAdmin]=useState(false);
  const [adminUser,setAdminUser]=useState('');

  const addToast=useCallback((msg,type='success')=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,message:msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4200);
  },[]);
  const rmToast=useCallback(id=>setToasts(p=>p.filter(t=>t.id!==id)),[]);
  const toast=useMemo(()=>({success:m=>addToast(m,'success'),error:m=>addToast(m,'error'),info:m=>addToast(m,'info')}),[addToast]);

  // Auth session
  useEffect(()=>{
    if(!supabase){setAuthLoading(false);return;}
    let m=true;
    supabase.auth.getSession().then(r=>{
      if(!m)return;
      const s=r.data.session;
      setUser(s?s.user:null);
      setShop(s&&s.user&&s.user.user_metadata?s.user.user_metadata.shop_name||'':'');
      setAuthLoading(false);
    }).catch(()=>setAuthLoading(false));
    const sub=supabase.auth.onAuthStateChange((_e,s)=>{
      setUser(s?s.user:null);
      setShop(s&&s.user&&s.user.user_metadata?s.user.user_metadata.shop_name||'':'');
      if(!s){setCustomers([]);setOrders([]);}
    });
    return()=>{m=false;try{sub.data.subscription.unsubscribe();}catch(e){}};
  },[]);

  // Load shop data
  useEffect(()=>{
    if(!user||!supabase||isAdmin)return;
    let active=true;
    setDataLoading(true);
    (async()=>{
      try{
        const [c,o]=await Promise.all([
          supabase.from('customers').select('*').order('created_at',{ascending:false}),
          supabase.from('orders').select('*').order('delivery_date',{ascending:true}),
        ]);
        if(!active)return;
        if(c.error)toast.error('Customers: '+c.error.message);else setCustomers(c.data||[]);
        if(o.error)toast.error('Orders: '+o.error.message);else setOrders(o.data||[]);
      }catch(e){toast.error('Load: '+e.message);}
      finally{if(active)setDataLoading(false);}
    })();
    const ch=supabase.channel('shop-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'customers'},p=>{
        setCustomers(prev=>{
          if(p.eventType==='INSERT')return [p.new,...prev];
          if(p.eventType==='UPDATE')return prev.map(c=>c.id===p.new.id?p.new:c);
          if(p.eventType==='DELETE')return prev.filter(c=>c.id!==p.old.id);
          return prev;
        });
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},p=>{
        setOrders(prev=>{
          if(p.eventType==='INSERT')return [p.new,...prev];
          if(p.eventType==='UPDATE')return prev.map(o=>o.id===p.new.id?p.new:o);
          if(p.eventType==='DELETE')return prev.filter(o=>o.id!==p.old.id);
          return prev;
        });
      })
      .subscribe();
    return()=>{active=false;try{supabase.removeChannel(ch);}catch(e){}};
  },[user,toast,isAdmin]);

  // Admin login
  const adminLogin=async(u,p)=>{
    const clean=String(u).trim().toLowerCase();
    if(clean==='admin'&&p==='123'){setIsAdmin(true);setAdminUser('admin');toast.success('Welcome, admin.');return;}
    if(!supabase)throw new Error('Supabase not configured.');
    const r=await supabase.from('platform_admins').select('*').eq('username',clean).eq('password',p).limit(1);
    if(r.error)throw new Error(r.error.message);
    if(!r.data||r.data.length===0)throw new Error('Invalid username or password.');
    setIsAdmin(true);setAdminUser(clean);toast.success('Welcome, '+clean+'.');
  };

  const adminLogout=()=>{setIsAdmin(false);setAdminUser('');setView('landing');};

  const login=async(e,p)=>{
    const r=await supabase.auth.signInWithPassword({email:e,password:p});
    if(r.error)throw r.error;
    toast.success('Welcome back!');
    setView('shop');
  };
  const signup=async(e,p,s)=>{
    const r=await supabase.auth.signUp({email:e,password:p,options:{data:{shop_name:s}}});
    if(r.error)throw r.error;
    if(r.data&&r.data.user&&!r.data.session)toast.info('Check your email to confirm.');
    else if(r.data&&r.data.session){toast.success('Account created!');setView('shop');}
  };
  const logout=async()=>{try{await supabase.auth.signOut();}catch(e){}setRoute({name:'dashboard',params:{}});setView('landing');};

  // CRUD
  const createCustomer=async d=>{const r=await supabase.from('customers').insert({name:d.name,phone:d.phone,measurements:{},user_id:user.id}).select().single();if(r.error)throw r.error;return r.data;};
  const updateCustomer=async(id,d)=>{const r=await supabase.from('customers').update({...d,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;};
  const deleteCustomer=async id=>{const r=await supabase.from('customers').delete().eq('id',id);if(r.error)throw r.error;};
  const createOrder=async(d,existing)=>{
    const nums=existing.map(o=>parseInt((o.order_code||'ORD-1000').replace('ORD-',''),10)).filter(n=>!isNaN(n));
    const next=(nums.length?Math.max(...nums):1000)+1;
    const r=await supabase.from('orders').insert({
      order_code:'ORD-'+next,customer_id:Number(d.customer_id),user_id:user.id,
      garment:d.garment,fabric:d.fabric||'',price:Number(d.price),
      advance:Number(d.advance)||0,delivery_date:d.delivery_date,stage:'Received',notes:d.notes||'',
    }).select().single();
    if(r.error)throw r.error;
    return r.data;
  };
  const updateOrder=async(id,d)=>{const r=await supabase.from('orders').update({...d,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;};
  const moveOrder=async(id,s)=>{const r=await supabase.from('orders').update({stage:s,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;};
  const deleteOrder=async id=>{const r=await supabase.from('orders').delete().eq('id',id);if(r.error)throw r.error;};

  const nav=useCallback(r=>{
    if(typeof r==='string')setRoute({name:r,params:{}});
    else{const{params,...rest}=r;setRoute(rest);setRp(params||{});}
    setSidebar(false);window.scrollTo({top:0,behavior:'smooth'});
  },[]);

  const toastStack=(
    <div className="fixed bottom-4 right-4 z-[100] flex w-[calc(100%-2rem)] flex-col gap-2 no-print sm:w-96">
      {toasts.map(t=><Toast key={t.id} toast={t} onClose={()=>rmToast(t.id)}/>)}
    </div>
  );

  if(!supabase)return <Fragment><div className="min-h-screen flex items-center justify-center p-6" style={{background:'rgb(var(--navy-50))'}}><div className="card max-w-lg"><h2 className="text-lg font-bold" style={{color:'#dc2626'}}>Supabase not configured</h2><p className="mt-2 text-sm">{supabaseInitError}</p><p className="mt-3 text-xs">Edit the HTML file and add your Supabase URL and anon key at the top of the script tag.</p></div></div>{toastStack}</Fragment>;

  if(authLoading)return <div className="flex min-h-screen items-center justify-center" style={{background:'rgb(var(--navy-50))'}}><div className="spinner"/></div>;

  if(isAdmin)return <Fragment><AdminDashboard adminUser={adminUser} onLogout={adminLogout} toast={toast}/>{toastStack}</Fragment>;

  if(!user){
    if(view==='landing')return <Fragment><LandingPage onShop={()=>setView('shop')} onAdmin={()=>setView('admin')}/>{toastStack}</Fragment>;
    if(view==='admin')return <Fragment><Portal mode="admin" onBack={()=>setView('landing')} onLogin={adminLogin} onSignup={()=>{}}/>{toastStack}</Fragment>;
    return <Fragment><Portal mode="shop" onBack={()=>setView('landing')} onLogin={login} onSignup={signup}/>{toastStack}</Fragment>;
  }

  const titles={dashboard:'Dashboard',customers:'Customers',customer:'Customer Profile',measurements:'Measurements',orders:'Orders Board','order-new':'New Order',order:'Order Details','order-slip':'Order Slip',payments:'Pending Payments',settings:'Settings'};

  function render(){
    if(dataLoading)return <Loading label="Loading your data…"/>;
    switch(route.name){
      case'dashboard':return <Dashboard customers={customers} orders={orders} onNav={nav}/>;
      case'customers':return <Customers customers={customers} orders={orders} onCreate={createCustomer} onUpdate={updateCustomer} onDelete={deleteCustomer} onNav={nav} toast={toast} rp={rp} clearRp={()=>setRp({})}/>;
      case'customer':return <CustomerDetail customers={customers} orders={orders} onUpdate={updateCustomer} onDelete={deleteCustomer} onNav={nav} toast={toast} cid={Number(rp.id)}/>;
      case'measurements':return <Measurements customers={customers} onUpdate={updateCustomer} onNav={nav} toast={toast} cid={Number(rp.id)}/>;
      case'orders':return <Board customers={customers} orders={orders} onMove={moveOrder} onNav={nav} toast={toast} rp={rp}/>;
      case'order-new':return <NewOrder customers={customers} orders={orders} onCreate={createOrder} onNav={nav} toast={toast} rp={rp}/>;
      case'order':return <OrderDetail customers={customers} orders={orders} onUpdate={updateOrder} onMove={moveOrder} onDelete={deleteOrder} onNav={nav} toast={toast} oid={Number(rp.id)}/>;
      case'order-slip':return <Slip customers={customers} orders={orders} onNav={nav} oid={Number(rp.id)}/>;
      case'payments':return <Payments customers={customers} orders={orders} onNav={nav} toast={toast}/>;
      case'settings':return <Settings user={user} shop={shop} onLogout={logout}/>;
      default:return <Dashboard customers={customers} orders={orders} onNav={nav}/>;
    }
  }

  return (
    <div className="flex min-h-screen" style={{background:'rgb(var(--navy-50))'}}>
      <Sidebar open={sidebar} onClose={()=>setSidebar(false)} user={user} shop={shop} onLogout={logout} route={route} onNav={nav}/>
      <div className="flex min-w-0 flex-1 flex-col">
        <Topbar onMenu={()=>setSidebar(true)} title={titles[route.name]||'Tailor Order Manager'}/>
        <main className="flex-1 px-4 py-5 sm:px-6 sm:py-6 lg:px-8">{render()}</main>
      </div>
      {toastStack}
    </div>
  );
}

try{
  const rootEl=document.getElementById('root');
  if(rootEl){rootEl.innerHTML='';ReactDOM.createRoot(rootEl).render(<ErrorBoundary><App/></ErrorBoundary>);console.log('[Tailor] Mounted');}
}catch(e){
  document.getElementById('root').innerHTML='<div style="padding:2rem;color:#dc2626;font-family:sans-serif;"><h2>Mount failed</h2><pre>'+String(e&&e.message?e.message:e)+'</pre></div>';
}
</script>
</body>
</html>
