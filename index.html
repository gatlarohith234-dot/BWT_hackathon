<script>
  // ---- Global error overlay so we never see a blank page ----
  (function() {
    function showError(msg) {
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:#f0f4f8;font-family:Inter,system-ui,sans-serif;">' +
          '<div style="max-width:600px;background:#fff;border:1px solid #fecaca;border-radius:16px;padding:2rem;box-shadow:0 10px 30px rgba(0,0,0,.08);">' +
            '<h2 style="margin:0 0 1rem;font-size:18px;color:#dc2626;">Application error</h2>' +
            '<pre style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:12px;color:#334e68;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-word;">' + String(msg).replace(/</g,'&lt;') + '</pre>' +
            '<p style="color:#829ab1;font-size:12px;margin-top:1rem;">Open browser console (F12) for full details. Screenshot this and send it to the developer.</p>' +
          '</div>' +
        '</div>';
      console.error('[Tailor] Error:', msg);
    }
    window.addEventListener('error', function(e) {
      showError((e.message || 'Unknown error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function(e) {
      showError('Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
    });
  })();
</script>

<script type="text/babel" data-presets="react">
// ---- Wait for all deps to be ready ----
if (!window.React || !window.ReactDOM || !window.Babel) {
  document.getElementById('root').innerHTML =
    '<div style="padding:2rem;font-family:sans-serif;color:#dc2626;text-align:center;">' +
      '<h2>Loading libraries…</h2>' +
      '<p>If this message persists, refresh the page. Check your internet connection.</p>' +
    '</div>';
}

const { useState, useEffect, useMemo, useCallback, useRef, Fragment } = React;

// ============================================================
// CONFIGURE SUPABASE HERE
// ============================================================
const SUPABASE_URL      = 'PASTE_YOUR_URL_HERE';   // https://xxxxx.supabase.co
const SUPABASE_ANON_KEY = 'PASTE_YOUR_ANON_KEY_HERE';
// ============================================================

console.log('[Tailor] Boot:', { hasSupabase: !!window.supabase, url: SUPABASE_URL });

let supabase = null;
let supabaseInitError = null;
try {
  if (!window.supabase) throw new Error('Supabase SDK failed to load.');
  if (!SUPABASE_URL || SUPABASE_URL.indexOf('PASTE_') === 0 || SUPABASE_URL.indexOf('YOUR_') !== -1) {
    supabaseInitError = 'Supabase URL not configured. Replace PASTE_YOUR_URL_HERE.';
  } else if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf('PASTE_') === 0 || SUPABASE_ANON_KEY.indexOf('YOUR_') !== -1) {
    supabaseInitError = 'Supabase anon key not configured. Replace PASTE_YOUR_ANON_KEY_HERE.';
  } else if (SUPABASE_URL.indexOf('supabase.co') === -1 || SUPABASE_URL.indexOf('supabase.com') !== -1) {
    supabaseInitError = 'Invalid Supabase URL. It should look like https://xxxxx.supabase.co (not supabase.com/dashboard).';
  } else {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('[Tailor] Supabase client created.');
  }
} catch (e) {
  supabaseInitError = e.message || String(e);
  console.error('[Tailor] Supabase init error:', e);
}

// ============================================================
// ERROR BOUNDARY (class component)
// ============================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error('[Tailor] ErrorBoundary:', error, info); }
  render() {
    if (this.state.hasError) {
      const msg = this.state.error && this.state.error.message ? this.state.error.message : String(this.state.error);
      return (
        <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'2rem', background:'#f0f4f8', fontFamily:'Inter,sans-serif' }}>
          <div style={{ maxWidth:'600px', background:'#fff', border:'1px solid #fecaca', borderRadius:'16px', padding:'2rem', boxShadow:'0 10px 30px rgba(0,0,0,.08)' }}>
            <h2 style={{ margin:'0 0 1rem', fontSize:'18px', color:'#dc2626' }}>Something went wrong</h2>
            <pre style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:'8px', padding:'12px', fontSize:'12px', color:'#334e68', overflow:'auto', maxHeight:'280px', whiteSpace:'pre-wrap' }}>{msg}</pre>
            <button onClick={() => window.location.reload()} style={{ marginTop:'1rem', padding:'0.6rem 1rem', background:'#102a43', color:'white', border:'none', borderRadius:'6px', cursor:'pointer', fontSize:'14px' }}>Reload Page</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// ============================================================
// THEMES
// ============================================================
const THEMES = [
  { id:'navy-gold',       name:'Navy Gold',       swatch:['#102a43','#d98e2b'], mode:'light' },
  { id:'ocean',           name:'Ocean',           swatch:['#3b82f6','#f59e0b'], mode:'light' },
  { id:'cream',           name:'Cream',           swatch:['#faf5e6','#c8823c'], mode:'light' },
  { id:'rose',            name:'Rose',            swatch:['#f43f5e','#fb7185'], mode:'light' },
  { id:'emerald',         name:'Emerald',         swatch:['#16a34a','#eab308'], mode:'light' },
  { id:'lavender',        name:'Lavender',        swatch:['#9333ea','#ec4899'], mode:'light' },
  { id:'midnight-purple', name:'Midnight Purple', swatch:['#1a1a2e','#8b5cf6'], mode:'dark' },
  { id:'forest',          name:'Forest',          swatch:['#142319','#22c55e'], mode:'dark' },
  { id:'charcoal',        name:'Charcoal',        swatch:['#1e1e1e','#ea580c'], mode:'dark' },
  { id:'slate-dark',      name:'Slate Dark',      swatch:['#1e293b','#38bdf8'], mode:'dark' },
];

function applyTheme(id) {
  try {
    const theme = THEMES.find(t => t.id === id) || THEMES[0];
    document.documentElement.setAttribute('data-theme', theme.id);
    document.documentElement.setAttribute('data-dark', theme.mode === 'dark' ? '1' : '0');
    try { localStorage.setItem('tailor_theme', theme.id); } catch (e) {}
  } catch (e) { console.error('[Tailor] applyTheme failed:', e); }
}

// ============================================================
// ICON
// ============================================================
function Icon({ name, size = 16, className = '', strokeWidth = 2 }) {
  const lib = window.lucide ? (window.lucide.icons || window.lucide) : null;
  if (!lib) return <span style={{ display:'inline-block', width:size, height:size }} />;
  const node = lib[name] || lib[name.charAt(0).toUpperCase() + name.slice(1)];
  if (!node || !Array.isArray(node)) return <span style={{ display:'inline-block', width:size, height:size }} />;
  const children = node[2] || [];
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children.map((c, i) => React.createElement(c[0], { key: i, ...(c[1] || {}) }))}
    </svg>
  );
}

// ============================================================
// THEME SWITCHER
// ============================================================
function ThemeSwitcher({ compact = false }) {
  const [open, setOpen] = useState(false);
  const [current, setCurrent] = useState(function() {
    try { return localStorage.getItem('tailor_theme') || 'navy-gold'; } catch (e) { return 'navy-gold'; }
  });
  const ref = useRef(null);

  useEffect(function() { applyTheme(current); }, [current]);

  useEffect(function() {
    function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', h);
    return function() { document.removeEventListener('mousedown', h); };
  }, []);

  const pick = function(id) { setCurrent(id); setOpen(false); };
  const active = THEMES.find(function(t) { return t.id === current; }) || THEMES[0];

  return (
    <div ref={ref} className="relative">
      <button
        type="button"
        onClick={function() { setOpen(function(o) { return !o; }); }}
        className="flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium transition-colors"
        style={{ borderColor:'rgb(var(--navy-200))', background:'rgb(var(--card-bg))', color:'rgb(var(--navy-700))' }}
      >
        <Icon name="Palette" size={16} />
        {!compact && <span className="hidden sm:inline">{active.name}</span>}
        <div className="flex -space-x-1">
          <span className="h-3 w-3 rounded-full border border-white" style={{ background: active.swatch[0] }} />
          <span className="h-3 w-3 rounded-full border border-white" style={{ background: active.swatch[1] }} />
        </div>
      </button>
      {open && (
        <div
          className="absolute right-0 z-[200] mt-2 w-64 rounded-xl border shadow-elevated anim-in"
          style={{
            borderColor:'rgb(var(--navy-200))',
            background:'rgb(var(--card-bg))',
            maxHeight:'min(420px, 70vh)',
            overflowY:'auto'

function formatCurrency(v) { return '₹' + (Number(v) || 0).toLocaleString('en-IN', { maximumFractionDigits:0 }); }
function formatDate(d) {
  if (!d) return '—';
  const dt = typeof d === 'string' && d.length === 10 ? new Date(d + 'T00:00:00') : new Date(d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function formatDateTime(d) { if (!d) return '—'; const dt = new Date(d); if (isNaN(dt)) return '—'; return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
function todayStr() { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString().split('T')[0]; }
function addDaysStr(n) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; }
function initials(name) { if (!name) return '?'; return name.split(' ').map(function(n){return n[0];}).slice(0,2).join('').toUpperCase(); }
function greeting() { const h = new Date().getHours(); if (h < 12) return 'Good Morning'; if (h < 17) return 'Good Afternoon'; return 'Good Evening'; }
function getDueInfo(dd, stage) {
  if (stage === 'Delivered') return { label:'Delivered', severity:'done' };
  if (!dd) return { label:'No date', severity:'future' };
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dd + 'T00:00:00');
  const diff = Math.ceil((due - today) / 86400000);
  if (diff < 0) return { label:'Overdue ' + Math.abs(diff) + 'd', severity:'overdue', days:Math.abs(diff) };
  if (diff === 0) return { label:'Due Today', severity:'today', days:0 };
  if (diff <= 3) return { label:'Due in ' + diff + 'd', severity:'soon', days:diff };
  return { label:'Due in ' + diff + 'd', severity:'future', days:diff };
}
function buildWhatsAppLink(phone, message) {
  const clean = String(phone || '').replace(/\D/g, '');
  const full = clean.length === 10 ? '91' + clean : clean;
  return 'https://wa.me/' + full + '?text=' + encodeURIComponent(message);
}

  useEffect(function() {
    if (open) document.body.style.overflow = 'hidden'; else document.body.style.overflow = '';

  }, [open]);
  if (!open) return null;
  const sizes = { sm:'max-w-md', md:'max-w-lg', lg:'max-w-2xl', xl:'max-w-4xl' };
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center">

function MeasurementForm({ initial = {}, onSubmit, onCancel, loading }) {
  const [values, setValues] = useState(function() {
    const base = {};
    MEASUREMENT_FIELDS.forEach(function(f){ base[f.key] = initial[f.key] !== undefined ? initial[f.key] : ''; });
    Object.keys(initial).forEach(function(k){ if (!MEASUREMENT_FIELDS.find(function(f){return f.key===k;})) base[k] = initial[k]; });
    return base;
  });
  const [customFields, setCustomFields] = useState(function(){ return Object.keys(initial).filter(function(k){ return !MEASUREMENT_FIELDS.find(function(f){return f.key===k;}); }); });
  const [newField, setNewField] = useState('');
  function update(k, v) { const clean = v.replace(/[^0-9.]/g, ''); setValues(function(p){ const n = Object.assign({},p); n[k]=clean; return n; }); }
  function submit(ev) {
    ev.preventDefault();
    const cleaned = {};
    Object.keys(values).forEach(function(k){ if (values[k] !== '' && values[k] != null) cleaned[k] = Number(values[k]); });
    onSubmit(cleaned);
  }
  function addCustom() {
    const key = newField.trim().toLowerCase().replace(/\s+/g, '_');
    if (!key || values[key] !== undefined) return;
    setCustomFields(function(p){ return p.concat([key]); });
    setValues(function(p){ const n = Object.assign({},p); n[key]=''; return n; });
    setNewField('');
  }
  function removeCustom(key) {
    setCustomFields(function(p){ return p.filter(function(k){return k!==key;}); });
    setValues(function(p){ const n = Object.assign({},p); delete n[key]; return n; });
  }
  return (
    <form onSubmit={submit} className="space-y-5">
      <div className="flex items-center gap-2 rounded-lg bg-gold-50 px-3.5 py-2.5 text-xs font-medium text-gold-700 ring-1 ring-gold-200"><Icon name="Ruler" size={14} /> All measurements are in inches. Leave blank any that don't apply.</div>
      <div className="grid grid-cols-2 gap-4 sm:grid-cols-3">
        {MEASUREMENT_FIELDS.map(function(f) {
          return (
            <div key={f.key}>
              <label className="label">{f.label}</label>
              <input value={values[f.key] !== undefined ? values[f.key] : ''} onChange={function(e){update(f.key, e.target.value);}} placeholder="0" inputMode="decimal" className="input" />
            </div>
          );
        })}
      </div>
      {customFields.length > 0 && (
        <div className="grid grid-cols-2 gap-4 border-t pt-4 sm:grid-cols-3" style={{ borderColor:'rgb(var(--navy-200))' }}>
          {customFields.map(function(key) {
            return (
              <div key={key} className="relative">
                <label className="label capitalize">{key.replace(/_/g,' ')}</label>
                <input value={values[key] !== undefined ? values[key] : ''} onChange={function(e){update(key,e.target.value);}} placeholder="0" inputMode="decimal" className="input pr-9" />
                <button type="button" onClick={function(){removeCustom(key);}} className="absolute right-2 top-8 rounded-md p-1"><Icon name="X" size={13} /></button>
              </div>
            );
          })}
        </div>
      )}
      <div className="flex items-center gap-2">
        <input value={newField} onChange={function(e){setNewField(e.target.value);}} placeholder="Add custom measurement…" className="input flex-1" />
        <button type="button" onClick={addCustom} className="btn-outline shrink-0"><Icon name="Plus" size={15} /> Add</button>
      </div>
      <div className="flex justify-end gap-2 border-t pt-4" style={{ borderColor:'rgb(var(--navy-200))' }}>
        <button type="button" onClick={onCancel} className="btn-outline" disabled={loading}>Cancel</button>
        <button type="submit" className="btn-primary" disabled={loading}>{loading ? 'Saving…' : 'Save Measurements'}</button>
      </div>
    </form>
  );
}

function PortalChoice({ mode, onBack, onLogin, onSignup }) {
  console.log('[Tailor] PortalChoice rendered, mode:', mode);
  const isAdmin = mode === 'admin';
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [shopName, setShopName] = useState('');
  const [mode2, setMode2] = useState('login');
  const [showPw, setShowPw] = useState(false);
  const [infoMsg, setInfoMsg] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setInfoMsg('');
    setBusy(true);
    try {
      if (isAdmin) {
        if (!email || !password) throw new Error('Please enter username and password.');
        await onLogin(email, password);
        return;
      }
      if (mode2 === 'signup' && !shopName.trim()) throw new Error('Please enter your shop name.');
      if (!email || !password) throw new Error('Please enter both email and password.');
      if (password.length < 6) throw new Error('Password must be at least 6 characters.');
      if (mode2 === 'signup') await onSignup(email, password, shopName.trim());
      else await onLogin(email, password);
    } catch (err) {
      setInfoMsg(err.message || String(err));
    } finally { setBusy(false); }
  }

  return (
    <div className="flex min-h-screen" style={{ background:'rgb(var(--navy-950))' }}>
      <div className="relative hidden w-1/2 flex-col justify-between overflow-hidden p-12 lg:flex" style={{ background:'rgb(var(--navy-950))' }}>
        <div className="pointer-events-none absolute inset-0" style={{ opacity:.04, backgroundImage:'radial-gradient(circle at 1px 1px, white 1px, transparent 0)', backgroundSize:'32px 32px' }} />
        <button type="button" onClick={onBack} className="relative flex items-center gap-2 text-sm transition-colors" style={{ color:'rgb(var(--navy-400))' }}>
          <Icon name="ArrowLeft" size={16} /> Back to home
        </button>
        <div className="relative">
          <div className="flex items-center gap-3">
            <div className="flex h-12 w-12 items-center justify-center rounded-xl" style={{ background:'rgba(232,168,78,0.15)', border:'1px solid rgba(232,168,78,0.3)' }}>
              <Icon name={isAdmin ? 'Shield' : 'Store'} size={24} className="text-gold-400" />
            </div>
            <div>
              <h2 className="text-lg font-semibold text-white">{isAdmin ? 'Admin Portal' : 'Shop Portal'}</h2>
              <p className="text-xs" style={{ color:'rgb(var(--navy-400))' }}>{isAdmin ? 'Platform management' : 'Manage your tailoring business'}</p>
            </div>
          </div>
          <h3 className="mt-8 text-3xl font-bold leading-tight text-white">
            {isAdmin ? 'Platform administration.' : 'Your shop, perfectly managed.'}
          </h3>
          <p className="mt-4 max-w-md text-sm leading-relaxed" style={{ color:'rgb(var(--navy-400))' }}>
            {isAdmin ? 'Manage platform admins and control access.' : 'Sign up free and start adding customers, orders, and payments today.'}
          </p>
        </div>
        <p className="relative text-[11px]" style={{ color:'rgb(var(--navy-600))' }}>© 2026 Tailor Order Manager</p>
      </div>

      <div className="flex w-full items-center justify-center p-6 lg:w-1/2" style={{ background:'rgb(var(--navy-50))' }}>
        <div className="w-full max-w-sm">
          <div className="mb-4 flex items-center justify-between">
            <button type="button" onClick={onBack} className="flex items-center gap-1.5 text-xs lg:hidden" style={{ color:'rgb(var(--navy-500))' }}>
              <Icon name="ArrowLeft" size={14} /> Back
            </button>
            <ThemeSwitcher compact />
          </div>

          {!isAdmin && (
            <div className="mb-5 flex rounded-xl p-1" style={{ background:'rgb(var(--navy-100))' }}>
              <button type="button" onClick={function(){setMode2('login');setInfoMsg('');}} className="flex-1 rounded-lg px-3 py-2 text-sm font-medium transition-all" style={{ background: mode2==='login' ? 'rgb(var(--card-bg))' : 'transparent', color: mode2==='login' ? 'rgb(var(--navy-900))' : 'rgb(var(--navy-500))' }}>Log In</button>
              <button type="button" onClick={function(){setMode2('signup');setInfoMsg('');}} className="flex-1 rounded-lg px-3 py-2 text-sm font-medium transition-all" style={{ background: mode2==='signup' ? 'rgb(var(--card-bg))' : 'transparent', color: mode2==='signup' ? 'rgb(var(--navy-900))' : 'rgb(var(--navy-500))' }}>Sign Up</button>
            </div>
          )}

          <h2 className="text-2xl font-bold tracking-tight" style={{ color:'rgb(var(--navy-900))' }}>
            {isAdmin ? 'Admin login' : mode2 === 'login' ? 'Welcome back' : 'Create your shop'}
          </h2>
          <p className="mt-1 text-sm" style={{ color:'rgb(var(--navy-500))' }}>
            {isAdmin ? 'Sign in to manage platform admins.' : mode2 === 'login' ? 'Sign in to your shop.' : 'Free forever. No credit card.'}
          </p>

          <form onSubmit={submit} className="mt-7 space-y-4">
            {!isAdmin && mode2 === 'signup' && (
              <div>
                <label className="label">Shop Name</label>
                <input value={shopName} onChange={function(e){setShopName(e.target.value);}} placeholder="Perfect Fit Tailors" className="input" />
              </div>
            )}
            <div>
              <label className="label">{isAdmin ? 'Username' : 'Email'}</label>
              <input type={isAdmin ? 'text' : 'email'} value={email} onChange={function(e){setEmail(e.target.value);}} placeholder={isAdmin ? 'admin' : 'you@example.com'} className="input" autoFocus />
            </div>
            <div>
              <label className="label">Password</label>
              <div className="relative">
                <input type={showPw ? 'text' : 'password'} value={password} onChange={function(e){setPassword(e.target.value);}} placeholder={isAdmin ? '123' : 'At least 6 characters'} className="input pr-10" />
                <button type="button" onClick={function(){setShowPw(!showPw);}} className="absolute right-3 top-1/2 -translate-y-1/2"><Icon name={showPw ? 'EyeOff' : 'Eye'} size={15} /></button>
              </div>
            </div>
            {infoMsg && <div className="rounded-lg border border-red-200 bg-red-50 px-3.5 py-2.5 text-xs text-red-700">{infoMsg}</div>}
            <button type="submit" className="btn-primary w-full" disabled={busy}>
              {busy ? 'Please wait…' : isAdmin ? 'Sign In as Admin' : mode2 === 'login' ? 'Sign In' : 'Create Account'}
            </button>
          </form>

          {isAdmin && (
            <div className="mt-5 rounded-lg px-4 py-3 text-xs" style={{ background:'rgb(var(--gold-50))', border:'1px solid rgb(var(--gold-200))', color:'rgb(var(--gold-800))' }}>
              <strong>Demo:</strong> username <code>admin</code>, password <code>123</code>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function AdminDashboardPage({ adminUser, admins, onAdd, onDelete, onLogout, adminLoading, toast }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);

  async function submitAdd(e) {
    e.preventDefault();
    if (!username.trim() || !password.trim()) { toast.error('Username and password required.'); return; }
    if (password.length < 3) { toast.error('Password must be at least 3 characters.'); return; }
    setBusy(true);
    try {
      await onAdd(username.trim(), password.trim());
      toast.success('Admin "' + username + '" added.');
      setUsername(''); setPassword('');
    } catch (err) { toast.error(err.message || 'Failed.'); }
    finally { setBusy(false); }
  }

  async function handleDelete() {
    if (!confirmDel) return;
    try { await onDelete(confirmDel.id); toast.success('Admin removed.'); setConfirmDel(null); }
    catch (err) { toast.error(err.message || 'Failed.'); }
  }

  return (
    <div className="min-h-screen" style={{ background:'rgb(var(--navy-50))' }}>
      <header className="border-b" style={{ borderColor:'rgb(var(--navy-200))', background:'rgb(var(--card-bg))' }}>
        <div className="mx-auto flex max-w-5xl items-center justify-between px-4 py-4 sm:px-6">
          <div className="flex items-center gap-3">
            <div className="flex h-10 w-10 items-center justify-center rounded-xl" style={{ background:'rgb(var(--navy-900))' }}><Icon name="Shield" size={20} className="text-gold-400" /></div>
            <div>
              <h1 className="text-sm font-bold" style={{ color:'rgb(var(--navy-900))' }}>Admin Portal</h1>
              <p className="text-[11px]" style={{ color:'rgb(var(--navy-500))' }}>Signed in as {adminUser}</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <ThemeSwitcher />
            <button type="button" onClick={onLogout} className="btn-outline btn-sm" style={{ color:'#dc2626' }}><Icon name="LogOut" size={14} /> Sign Out</button>
          </div>
        </div>
      </header>
      <main className="mx-auto max-w-5xl px-4 py-8 sm:px-6">
        <div className="mb-6">
          <h2 className="text-xl font-bold" style={{ color:'rgb(var(--navy-900))' }}>Platform Administration</h2>
          <p className="mt-1 text-sm" style={{ color:'rgb(var(--navy-500))' }}>Manage who has admin access.</p>
        </div>
        <div className="grid gap-5 lg:grid-cols-3">
          <div className="card lg:col-span-1">
            <h3 className="text-sm font-bold" style={{ color:'rgb(var(--navy-900))' }}>Add New Admin</h3>
            <p className="mt-1 text-xs" style={{ color:'rgb(var(--navy-500))' }}>New admins can sign in with these credentials.</p>
            <form onSubmit={submitAdd} className="mt-4 space-y-3">
              <div><label className="label">Username</label><input value={username} onChange={function(e){setUsername(e.target.value);}} placeholder="e.g. manager1" className="input" /></div>
              <div><label className="label">Password</label><input value={password} onChange={function(e){setPassword(e.target.value);}} placeholder="Min 3 characters" className="input" /></div>
              <button type="submit" className="btn-gold w-full" disabled={busy}><Icon name="UserPlus" size={15} /> {busy ? 'Adding…' : 'Add Admin'}</button>
            </form>
          </div>
          <div className="card lg:col-span-2">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold" style={{ color:'rgb(var(--navy-900))' }}>Platform Admins</h3>
              <span className="badge" style={{ background:'rgb(var(--navy-100))', color:'rgb(var(--navy-600))' }}>{adminLoading ? '…' : admins.length + ' total'}</span>
            </div>
            {adminLoading ? <LoadingSpinner label="Loading admins…" /> : admins.length === 0 ? (
              <div className="mt-4"><EmptyState icon="Shield" title="No admins found" /></div>
            ) : (
              <div className="mt-4 divide-y" style={{ borderColor:'rgb(var(--navy-200))' }}>
                {admins.map(function(a) {
                  return (
                    <div key={a.id || a.username} className="flex items-center gap-3 py-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-full" style={{ background:'rgb(var(--gold-100))', color:'rgb(var(--gold-700))' }}><span className="text-sm font-bold">{initials(a.username)}</span></div>
                      <div className="flex-1 min-w-0">
                        <p className="truncate text-sm font-semibold" style={{ color:'rgb(var(--navy-800))' }}>{a.username}</p>
                        <p className="text-xs" style={{ color:'rgb(var(--navy-400))' }}>{a.isDefault ? 'Built-in admin · cannot be removed' : 'Added ' + formatDate(a.created_at)}</p>
                      </div>
                      {a.isDefault ? (
                        <span className="badge" style={{ background:'rgb(var(--gold-100))', color:'rgb(var(--gold-700))' }}><Icon name="Crown" size={11} /> Root</span>
                      ) : (
                        <button type="button" onClick={function(){setConfirmDel(a);}} className="rounded-lg p-2"><Icon name="Trash2" size={15} /></button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </main>
      <ConfirmDialog open={!!confirmDel} onClose={function(){setConfirmDel(null);}} onConfirm={handleDelete} title="Remove admin?" message={'Remove admin access for "' + (confirmDel ? confirmDel.username : '') + '"?'} confirmLabel="Remove" />
    </div>
  );
}

function Sidebar({ open, onClose, user, shopName, onLogout, route, onNav }) {
  const nav = [
    { name:'dashboard', label:'Dashboard', icon:'LayoutDashboard' },
    { name:'customers', label:'Customers', icon:'Users' },
    { name:'orders', label:'Orders Board', icon:'ClipboardList' },
    { name:'payments', label:'Pending Payments', icon:'Wallet' },
    { name:'settings', label:'Settings', icon:'Settings' },
  ];
  function isActive(name) {
    if (name === 'orders') return ['orders','order','order-new','order-slip'].indexOf(route.name) !== -1;
    if (name === 'customers') return ['customers','customer','measurements'].indexOf(route.name) !== -1;
    return route.name === name;
  }
  return (
    <Fragment>
      {open && <div className="fixed inset-0 z-40 backdrop-blur-sm lg:hidden" style={{ background:'rgba(0,0,0,0.4)' }} onClick={onClose} />}

            <div>
              <h1 className="text-sm font-semibold">{shopName || 'Tailor Order'}</h1>
              <p className="text-[11px]" style={{ color:'rgb(var(--navy-400))' }}>Manager</p>
            </div>
          </div>
          <button type="button" onClick={onClose} className="rounded-lg p-1.5 lg:hidden"><Icon name="X" size={18} /></button>
        </div>
        <nav className="flex-1 space-y-1 px-3 py-2">
          {nav.map(function(item) {
            const active = isActive(item.name);
            return (

                <Icon name={item.icon} size={18} />{item.label}

        <div className="border-t p-4" style={{ borderColor:'rgba(255,255,255,0.08)' }}>

              <p className="truncate text-[11px]" style={{ color:'rgb(var(--navy-400))' }}>{user && user.email}</p>
            </div>
            <button type="button" onClick={onLogout} className="rounded-lg p-2" title="Log out"><Icon name="LogOut" size={16} /></button>
          </div>
        </div>
      </aside>
    </Fragment>
  );
}

function DashboardPage({ customers, orders, onNav }) {
  const stats = useMemo(function() {
    const today = todayStr(); const in3 = addDaysStr(3);
    const active = orders.filter(function(o){ return o.stage !== 'Delivered'; });
    const pendingBalance = active.reduce(function(s,o){ return s + Math.max(0, o.price - o.advance); }, 0);
    const stageCounts = {}; STAGES.forEach(function(s){ stageCounts[s] = orders.filter(function(o){return o.stage===s;}).length; });
    const monthKey = new Date().toISOString().slice(0,7);
    const revenueThisMonth = orders.filter(function(o){ return o.created_at && o.created_at.slice(0,7) === monthKey; }).reduce(function(s,o){ return s + Number(o.advance || 0); }, 0);
    const completedThisMonth = orders.filter(function(o){ return o.stage === 'Delivered' && o.updated_at && o.updated_at.slice(0,7) === monthKey; }).length;
    const urgent = active.filter(function(o){ return o.delivery_date <= in3; }).sort(function(a,b){return a.delivery_date.localeCompare(b.delivery_date);}).slice(0,8);
    const recentCustomers = customers.slice().sort(function(a,b){ return (b.created_at||'').localeCompare(a.created_at||''); }).slice(0,5);
    const garmentCounts = {}; orders.forEach(function(o){ garmentCounts[o.garment] = (garmentCounts[o.garment] || 0) + 1; });
    const popular = Object.entries(garmentCounts).sort(function(a,b){return b[1]-a[1];})[0];
    return { totalCustomers: customers.length, activeOrders: active.length, dueToday: active.filter(function(o){return o.delivery_date===today;}).length, dueSoon: active.filter(function(o){return o.delivery_date > today && o.delivery_date <= in3;}).length, overdue: active.filter(function(o){return o.delivery_date < today;}).length, pendingBalance: pendingBalance, stageCounts: stageCounts, revenueThisMonth: revenueThisMonth, completedThisMonth: completedThisMonth, urgent: urgent, recentCustomers: recentCustomers, popularGarment: popular ? { garment: popular[0], count: popular[1] } : null };

        <DashboardCard label="Due Today" value={stats.dueToday} icon="CalendarClock" accent="orange" />

        <DashboardCard label="Overdue" value={stats.overdue} icon="AlertTriangle" accent="red" />

      <div className="grid gap-5 lg:grid-cols-3">
        <div className="card lg:col-span-2">
          <div className="flex items-center justify-between">
            <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Order Status Overview</h3>
            <button type="button" onClick={function(){onNav({name:'orders'});}} className="flex items-center gap-1 text-xs font-medium" style={{color:'rgb(var(--gold-600))'}}>View board <Icon name="ArrowRight" size={13} /></button>
          </div>
          <div className="mt-4 grid grid-cols-5 gap-2">
            {STAGES.map(function(stage) {
              const c = STAGE_STYLES[stage];
              return (
                <button key={stage} type="button" onClick={function(){onNav({name:'orders', params:{stage:stage}});}} className={'rounded-xl border p-2.5 text-center transition-all sm:p-3 ' + c.bg + ' ' + c.border}>

                <div className="flex h-9 w-9 items-center justify-center rounded-lg" style={{background:'rgb(var(--gold-100))', color:'rgb(var(--gold-600))'}}><Icon name="Shirt" size={17} /></div>
                <div><p className="text-[11px] font-medium" style={{color:'rgb(var(--gold-600))'}}>Top garment</p><p className="text-sm font-bold" style={{color:'rgb(var(--gold-800))'}}>{stats.popularGarment.garment}</p></div>
              </div>
            )}
          </div>
        </div>
      </div>
      <div className="card">
        <div className="flex items-center justify-between">
          <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Today's & Urgent Orders</h3>
          <button type="button" onClick={function(){onNav({name:'orders'});}} className="flex items-center gap-1 text-xs font-medium" style={{color:'rgb(var(--gold-600))'}}>All orders <Icon name="ArrowRight" size={13} /></button>
        </div>
        {stats.urgent.length === 0 ? <div className="mt-4"><EmptyState icon="CheckCircle2" title="No urgent orders" description="You're all caught up." /></div> : (
          <div className="mt-4 space-y-2">
            {stats.urgent.map(function(o) {
              const c = getCustomer(o.customer_id); const due = getDueInfo(o.delivery_date, o.stage); const bal = o.price - o.advance;
              const rowBg = { overdue:'bg-red-50 border-red-200', today:'bg-amber-50 border-amber-200', soon:'bg-orange-50 border-orange-200', future:'border-navy-200', done:'bg-emerald-50 border-emerald-200' };

// Customers Page
function CustomersPage({ customers, orders, onCreate, onUpdate, onDelete, onNav, toast, routeParams, clearParams }) {
  const [search, setSearch] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  useEffect(function() { if (routeParams && routeParams.new === 1) { setEditing(null); setModalOpen(true); clearParams && clearParams(); } }, [routeParams]);
  const enriched = useMemo(function() {
    const q = search.toLowerCase().trim();
    const list = !q ? customers : customers.filter(function(c){ return c.name.toLowerCase().indexOf(q)!==-1 || c.phone.indexOf(q)!==-1; });
    return list.map(function(c) {
      const cOrders = orders.filter(function(o){return o.customer_id===c.id;});
      const pendingBalance = cOrders.filter(function(o){return o.stage!=='Delivered';}).reduce(function(s,o){return s + Math.max(0, o.price - o.advance);}, 0);
      const lastOrder = cOrders.length ? cOrders.map(function(o){return o.created_at;}).sort().slice(-1)[0] : null;
      return Object.assign({}, c, { order_count: cOrders.length, pending_balance: pendingBalance, last_order: lastOrder });
    });
  }, [customers, orders, search]);
  async function handleSave(data) {
    try {
      if (editing) { await onUpdate(editing.id, data); toast.success(data.name + "'s details updated."); }
      else { await onCreate(data); toast.success(data.name + ' added.'); }
      setModalOpen(false); setEditing(null);
    } catch (err) { toast.error(err.message || 'Failed.'); }
  }
  async function handleDelete() {
    if (!confirmDelete) return;
    try { await onDelete(confirmDelete.id); toast.success(confirmDelete.name + ' removed.'); setConfirmDelete(null); }
    catch (err) { toast.error(err.message || 'Failed.'); }
  }
  return (
    <div className="space-y-5">
      <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div><h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Customers</h2><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>{customers.length} customer{customers.length !== 1 ? 's' : ''}</p></div>
        <button type="button" onClick={function(){setEditing(null);setModalOpen(true);}} className="btn-gold btn-sm"><Icon name="UserPlus" size={15} /> Add Customer</button>
      </div>
      <div className="max-w-md"><SearchBar value={search} onChange={setSearch} placeholder="Search by name or phone…" /></div>
      {enriched.length === 0 ? (
        <EmptyState icon="Users" title={search ? 'No customers found' : 'No customers yet'} description={search ? 'Try a different search.' : 'Add your first customer.'} action={!search && <button type="button" onClick={function(){setModalOpen(true);}} className="btn-gold btn-sm"><Icon name="UserPlus" size={14} /> Add Customer</button>} />
      ) : (
        <div className="space-y-2.5">
          {enriched.map(function(c) {
            return (
              <div key={c.id} className="card flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <button type="button" onClick={function(){onNav({name:'customer', params:{id:c.id}});}} className="flex items-center gap-3 text-left">
                  <div className="flex h-10 w-10 items-center justify-center rounded-full" style={{background:'rgb(var(--navy-100))', color:'rgb(var(--navy-600))'}}><span className="text-sm font-semibold">{initials(c.name)}</span></div>
                  <div><p className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>{c.name}</p><p className="text-xs" style={{color:'rgb(var(--navy-500))'}}>{c.phone} · {c.order_count} orders</p></div>
                </button>
                <div className="flex items-center gap-2">
                  {c.pending_balance > 0 && <span className="text-sm font-bold text-orange-600">{formatCurrency(c.pending_balance)}</span>}
                  <button type="button" onClick={function(){setEditing(c);setModalOpen(true);}} className="rounded-lg p-2"><Icon name="Pencil" size={15} /></button>
                  <button type="button" onClick={function(){setConfirmDelete(c);}} className="rounded-lg p-2"><Icon name="Trash2" size={15} /></button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      <Modal open={modalOpen} onClose={function(){setModalOpen(false);setEditing(null);}} title={editing ? 'Edit Customer' : 'Add New Customer'}>
        <CustomerForm initial={editing} onSubmit={handleSave} onCancel={function(){setModalOpen(false);setEditing(null);}} />
      </Modal>
      <ConfirmDialog open={!!confirmDelete} onClose={function(){setConfirmDelete(null);}} onConfirm={handleDelete} title="Delete customer?" message={'Delete ' + (confirmDelete ? confirmDelete.name : '') + ' and all their orders?'} />
    </div>
  );
}

// Orders Board
function OrdersBoardPage({ customers, orders, onMoveStage, onNav, toast, routeParams }) {
  const [search, setSearch] = useState('');
  const [dueFilter, setDueFilter] = useState('all');
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverStage, setDragOverStage] = useState(null);
  const stageParam = routeParams && routeParams.stage;
  const getCustomer = function(id) { return customers.find(function(c){return c.id===id;}); };
  const filtered = useMemo(function() {
    let list = orders.slice();
    if (stageParam) list = list.filter(function(o){return o.stage===stageParam;});
    if (dueFilter !== 'all') {
      const today = todayStr(); const in3 = addDaysStr(3);
      list = list.filter(function(o) {
        if (o.stage === 'Delivered') return false;
        if (dueFilter === 'overdue') return o.delivery_date < today;
        if (dueFilter === 'today') return o.delivery_date === today;
        if (dueFilter === 'soon') return o.delivery_date > today && o.delivery_date <= in3;
        return true;
      });
    }
    if (search.trim()) {
      const q = search.toLowerCase().trim();
      list = list.filter(function(o) {
        const c = getCustomer(o.customer_id);
        return (c && (c.name.toLowerCase().indexOf(q)!==-1 || c.phone.indexOf(q)!==-1)) || o.order_code.toLowerCase().indexOf(q)!==-1;
      });
    }
    return list;
  }, [orders, customers, search, dueFilter, stageParam]);
  async function handleDrop(stage) {
    if (!draggedId) return;
    const order = orders.find(function(o){return o.id===draggedId;});
    if (!order || order.stage === stage) { setDragOverStage(null); setDraggedId(null); return; }
    try { await onMoveStage(order.id, stage); toast.success(order.order_code + ' → ' + stage); }
    catch (e) { toast.error(e.message); }
    finally { setDragOverStage(null); setDraggedId(null); }
  }
  return (
    <div className="space-y-4">
      <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div><h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Orders Board</h2><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>Drag orders between stages.</p></div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="w-full sm:w-64"><SearchBar value={search} onChange={setSearch} placeholder="Search orders…" /></div>
          <select value={dueFilter} onChange={function(e){setDueFilter(e.target.value);}} className="input" style={{width:'auto'}}>
            <option value="all">All</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="soon">Due soon</option>
          </select>
          <button type="button" onClick={function(){onNav({name:'order-new'});}} className="btn-gold btn-sm"><Icon name="Plus" size={15} /> New</button>
        </div>
      </div>
      {orders.length === 0 ? (
        <EmptyState icon="ClipboardList" title="No orders yet" action={<button type="button" onClick={function(){onNav({name:'order-new'});}} className="btn-gold btn-sm"><Icon name="Plus" size={14} /> Create</button>} />
      ) : (
        <div className="kanban-scroll -mx-4 px-4 pb-3 sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8">
          <div className="flex gap-4" style={{minWidth: STAGES.length * 288}}>
            {STAGES.map(function(stage) {
              const stageOrders = filtered.filter(function(o){return o.stage===stage;});
              const c = STAGE_STYLES[stage];
              return (
                <div key={stage} className="flex w-72 shrink-0 flex-col">
                  <div className={'flex items-center justify-between rounded-t-xl border border-b-0 px-3.5 py-3 ' + c.bg + ' ' + c.border}>
                    <h3 className={'text-xs font-bold uppercase ' + c.text}>{stage}</h3>
                    <span className="rounded-full bg-white/70 px-2 py-0.5 text-[11px] font-bold" style={{color:'rgb(var(--navy-600))'}}>{stageOrders.length}</span>
                  </div>
                  <div onDragOver={function(e){e.preventDefault(); setDragOverStage(stage);}} onDrop={function(e){e.preventDefault(); handleDrop(stage);}} className={'flex min-h-[200px] flex-1 flex-col gap-2.5 rounded-b-xl border border-t-0 p-2.5 ' + c.border + ' ' + (dragOverStage===stage ? 'drag-over' : '')} style={{background:'rgb(var(--navy-50))'}}>
                    {stageOrders.map(function(o) {
                      const customer = getCustomer(o.customer_id); const due = getDueInfo(o.delivery_date, o.stage); const bal = o.price - o.advance;
                      return (
                        <div key={o.id} draggable onDragStart={function(e){e.dataTransfer.setData('text/plain', String(o.id)); setDraggedId(o.id);}} onDragEnd={function(){setDraggedId(null); setDragOverStage(null);}} onClick={function(){onNav({name:'order', params:{id:o.id}});}} className={'cursor-pointer rounded-xl border p-3.5 shadow-soft ' + (draggedId===o.id ? 'dragging' : '')} style={{background:'rgb(var(--card-bg))', borderColor:'rgb(var(--navy-200))'}}>
                          <div className="flex items-center justify-between"><span className="text-[11px] font-bold" style={{color:'rgb(var(--navy-400))'}}>{o.order_code}</span><DueBadge due={due} /></div>
                          <p className="mt-2 truncate text-sm font-semibold" style={{color:'rgb(var(--navy-900))'}}>{(customer && customer.name) || 'Unknown'}</p>
                          <p className="truncate text-xs" style={{color:'rgb(var(--navy-500))'}}>{o.garment}</p>
                          <div className="mt-3 flex items-center justify-between text-xs"><span style={{color:'rgb(var(--navy-500))'}}>{formatDate(o.delivery_date)}</span><span className={(bal > 0 ? 'text-orange-600' : 'text-emerald-600') + ' font-semibold'}>{bal > 0 ? formatCurrency(bal) : 'Paid'}</span></div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

          {filled.length > 0 && (
            <div className="mt-4">
              <p className="text-[10px] uppercase text-gray-400">Measurements (inches)</p>
              <div className="mt-2 grid grid-cols-3 gap-x-4 gap-y-2">
                {filled.map(function(e) {
                  const field = MEASUREMENT_FIELDS.find(function(f){return f.key===e[0];});
                  return <div key={e[0]} className="flex justify-between border-b border-dotted pb-1 text-xs"><span className="text-gray-500">{field ? field.label : e[0]}</span><span className="font-bold">{e[1]}"</span></div>;
                })}
              </div>
            </div>
          )}
          <div className="mt-5 rounded-lg border-2 p-4" style={{borderColor:'#102a43'}}>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div><p className="text-[10px] uppercase text-gray-400">Total</p><p className="mt-1 text-base font-bold">{formatCurrency(order.price)}</p></div>
              <div><p className="text-[10px] uppercase text-gray-400">Advance</p><p className="mt-1 text-base font-bold text-emerald-700">{formatCurrency(order.advance)}</p></div>
              <div><p className="text-[10px] uppercase text-gray-400">Balance</p><p className={'mt-1 text-base font-bold ' + (bal > 0 ? 'text-orange-600' : 'text-emerald-700')}>{formatCurrency(bal)}</p></div>
            </div>
          </div>
          {order.notes && <div className="mt-4 text-xs"><p className="text-[10px] uppercase text-gray-400">Notes</p><p className="mt-1">{order.notes}</p></div>}
          <p className="mt-3 text-center text-[9px] text-gray-400">Printed on {formatDateTime(new Date().toISOString())}</p>
        </div>
      </div>
    </div>
  );
}

// Pending Payments
function PendingPaymentsPage({ customers, orders, onNav, toast }) {
  const pending = useMemo(function(){ return orders.filter(function(o){return o.stage !== 'Delivered' && o.price - o.advance > 0;}).sort(function(a,b){return a.delivery_date.localeCompare(b.delivery_date);}); }, [orders]);
  const totalPending = pending.reduce(function(s,o){return s + (o.price - o.advance);}, 0);
  const getCustomer = function(id) { return customers.find(function(c){return c.id===id;}); };
  return (
    <div className="space-y-5">
      <div><h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Pending Payments</h2><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>Track outstanding balances.</p></div>
      <div className="card" style={{background:'rgb(var(--navy-900))', borderColor:'rgb(var(--navy-800))'}}>
        <div className="flex items-center justify-between">
          <div><p className="text-[11px] uppercase" style={{color:'rgb(var(--navy-400))'}}>Total Pending</p><p className="mt-2 text-3xl font-bold" style={{color:'rgb(var(--gold-400))'}}>{formatCurrency(totalPending)}</p><p className="mt-1 text-xs" style={{color:'rgb(var(--navy-400))'}}>Across {pending.length} orders</p></div>
          <div className="flex h-14 w-14 items-center justify-center rounded-2xl" style={{background:'rgba(232,168,78,0.15)', color:'rgb(var(--gold-400))'}}><Icon name="Wallet" size={26} /></div>
        </div>
      </div>
      {pending.length === 0 ? <EmptyState icon="IndianRupee" title="All payments collected" /> : (
        <div className="space-y-2.5">
          {pending.map(function(o) {
            const c = getCustomer(o.customer_id); const balance = o.price - o.advance;
            const msg = 'Hi ' + (c && c.name) + ', order ' + o.order_code + ' ready. Balance ₹' + balance + '.';
            return (
              <div key={o.id} className="card flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <button type="button" onClick={function(){onNav({name:'order', params:{id:o.id}});}} className="flex flex-1 items-center gap-3 text-left min-w-0">
                  <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-orange-100 text-orange-600"><Icon name="IndianRupee" size={18} /></div>
                  <div className="min-w-0"><div className="flex flex-wrap items-center gap-2"><span className="text-xs font-bold" style={{color:'rgb(var(--navy-500))'}}>{o.order_code}</span><StatusBadge stage={o.stage} /></div><p className="mt-0.5 truncate text-sm font-semibold" style={{color:'rgb(var(--navy-900))'}}>{(c && c.name) || '—'}</p><p className="text-xs" style={{color:'rgb(var(--navy-400))'}}>{o.garment}</p></div>
                </button>
                <div className="flex items-center justify-between gap-3 sm:justify-end">
                  <div className="text-right"><p className="text-xs" style={{color:'rgb(var(--navy-400))'}}>Balance</p><p className="text-lg font-bold text-orange-600">{formatCurrency(balance)}</p></div>
                  <a href={buildWhatsAppLink(c && c.phone, msg)} target="_blank" rel="noreferrer" className="btn-gold btn-sm"><Icon name="MessageCircle" size={14} /> Remind</a>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Settings
function SettingsPage({ user, shopName, onLogout }) {
  return (
    <div className="mx-auto max-w-2xl space-y-5">
      <div><h2 className="text-lg font-bold" style={{color:'rgb(var(--navy-900))'}}>Settings</h2><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>Manage your account.</p></div>
      <div className="card">
        <div className="flex items-center gap-4">
          <div className="flex h-16 w-16 items-center justify-center rounded-2xl text-xl font-bold" style={{background:'rgb(var(--navy-900))', color:'rgb(var(--gold-400))'}}>{initials(shopName || (user && user.email) || 'U')}</div>
          <div><h3 className="text-base font-bold" style={{color:'rgb(var(--navy-900))'}}>{shopName || 'My Shop'}</h3><p className="text-sm" style={{color:'rgb(var(--navy-500))'}}>{user && user.email}</p></div>
        </div>
      </div>
      <div className="card">
        <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Appearance</h3>
        <p className="mt-1 text-xs" style={{color:'rgb(var(--navy-500))'}}>Pick from 10 themes.</p>
        <div className="mt-3"><ThemeSwitcher /></div>
      </div>
      <div className="card">
        <h3 className="text-sm font-semibold" style={{color:'rgb(var(--navy-800))'}}>Account</h3>
        <button type="button" onClick={onLogout} className="btn-outline btn-sm mt-3" style={{color:'#dc2626'}}><Icon name="LogOut" size={15} /> Sign Out</button>
      </div>

  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [user, setUser] = useState(null);
  const [shopName, setShopName] = useState('');
  const [authLoading, setAuthLoading] = useState(true);
  const [customers, setCustomers] = useState([]);
  const [orders, setOrders] = useState([]);
  const [dataLoading, setDataLoading] = useState(false);
  const [route, setRoute] = useState({ name:'dashboard', params:{} });
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [routeParams, setRouteParams] = useState({});
  const [publicView, setPublicView] = useState('landing');
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminUser, setAdminUser] = useState('');
  const [admins, setAdmins] = useState([]);
  const [adminLoading, setAdminLoading] = useState(false);

  const addToast = useCallback(function(message, type) {
    if (type === undefined) type = 'success';
    const id = Date.now() + Math.random();
    setToasts(function(prev){ return prev.concat([{ id: id, message: message, type: type }]); });
    setTimeout(function(){ setToasts(function(prev){ return prev.filter(function(t){return t.id!==id;}); }); }, 4200);
  }, []);
  const removeToast = useCallback(function(id){ setToasts(function(prev){ return prev.filter(function(t){return t.id!==id;}); }); }, []);
  const toast = useMemo(function() {
    return { success: function(m){addToast(m,'success');}, error: function(m){addToast(m,'error');}, info: function(m){addToast(m,'info');} };
  }, [addToast]);

  // Auth session
  useEffect(function() {
    if (!supabase) { setAuthLoading(false); return; }
    let mounted = true;
    supabase.auth.getSession().then(function(res) {
      if (!mounted) return;
      const s = res.data.session;
      setUser(s ? s.user : null);
      setShopName(s && s.user && s.user.user_metadata ? s.user.user_metadata.shop_name || '' : '');
      setAuthLoading(false);
    }).catch(function(){ setAuthLoading(false); });
    const sub = supabase.auth.onAuthStateChange(function(_e, session) {
      setUser(session ? session.user : null);
      setShopName(session && session.user && session.user.user_metadata ? session.user.user_metadata.shop_name || '' : '');
      if (!session) { setCustomers([]); setOrders([]); }
    });
    return function() { mounted = false; try { sub.data.subscription.unsubscribe(); } catch (e) {} };
  }, []);

  // Load shop data
  useEffect(function() {
    if (!user || !supabase || isAdmin) return;
    let active = true;
    setDataLoading(true);
    (async function() {
      try {
        const results = await Promise.all([
          supabase.from('customers').select('*').order('created_at', { ascending: false }),
          supabase.from('orders').select('*').order('delivery_date', { ascending: true }),
        ]);
        if (!active) return;
        if (results[0].error) toast.error('Load customers: ' + results[0].error.message);
        else setCustomers(results[0].data || []);
        if (results[1].error) toast.error('Load orders: ' + results[1].error.message);
        else setOrders(results[1].data || []);
      } catch (e) { toast.error('Load: ' + e.message); }
      finally { if (active) setDataLoading(false); }
    })();
    const ch = supabase.channel('tailor-rt')
      .on('postgres_changes', { event:'*', schema:'public', table:'customers' }, function(payload) {
        setCustomers(function(prev) {
          if (payload.eventType === 'INSERT') return [payload.new].concat(prev);
          if (payload.eventType === 'UPDATE') return prev.map(function(c){return c.id === payload.new.id ? payload.new : c;});
          if (payload.eventType === 'DELETE') return prev.filter(function(c){return c.id !== payload.old.id;});
          return prev;
        });
      })
      .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, function(payload) {
        setOrders(function(prev) {
          if (payload.eventType === 'INSERT') return [payload.new].concat(prev);
          if (payload.eventType === 'UPDATE') return prev.map(function(o){return o.id === payload.new.id ? payload.new : o;});
          if (payload.eventType === 'DELETE') return prev.filter(function(o){return o.id !== payload.old.id;});
          return prev;
        });
      })
      .subscribe();
    return function() { active = false; try { supabase.removeChannel(ch); } catch (e) {} };
  }, [user, toast, isAdmin]);

  const loadAdmins = useCallback(async function() {
    if (!supabase) return;
    setAdminLoading(true);
    try {
      const res = await supabase.from('platform_admins').select('*').order('created_at', { ascending: true });
      if (res.error) throw res.error;
      const extras = (res.data || []).filter(function(a){return a.username !== 'admin';}).map(function(a){ return Object.assign({}, a, { isDefault: false }); });
      setAdmins([{ id: 'root', username: 'admin', isDefault: true }].concat(extras));
    } catch (err) {
      toast.error('Load admins: ' + err.message);
      setAdmins([{ id: 'root', username: 'admin', isDefault: true }]);
    } finally { setAdminLoading(false); }
  }, [toast]);

  useEffect(function() { if (isAdmin) loadAdmins(); }, [isAdmin, loadAdmins]);

  useEffect(function() {
    if (!isAdmin || !supabase) return;
    const ch = supabase.channel('admins-rt').on('postgres_changes', { event:'*', schema:'public', table:'platform_admins' }, function(){ loadAdmins(); }).subscribe();
    return function() { try { supabase.removeChannel(ch); } catch (e) {} };
  }, [isAdmin, loadAdmins]);

  async function handleAdminLogin(username, password) {
    console.log('[Tailor] admin login attempt:', username);
    const clean = String(username).trim().toLowerCase();
    if (clean === 'admin' && password === '123') {
      setIsAdmin(true); setAdminUser('admin');
      toast.success('Welcome, admin.');
      return;
    }
    if (!supabase) throw new Error('Supabase not configured.');
    const res = await supabase.from('platform_admins').select('*').eq('username', clean).eq('password', password).limit(1);
    if (res.error) throw new Error(res.error.message);
    if (!res.data || res.data.length === 0) throw new Error('Invalid username or password.');
    setIsAdmin(true); setAdminUser(clean);
    toast.success('Welcome, ' + clean + '.');
  }

  function handleAdminLogout() {
    setIsAdmin(false); setAdminUser(''); setAdmins([]);
    setPublicView('landing');
    toast.info('Signed out.');
  }

  async function handleAddAdmin(username, password) {
    if (!supabase) throw new Error('Supabase not configured.');
    const clean = username.trim().toLowerCase();
    if (clean === 'admin') throw new Error('"admin" is reserved.');
    const res = await supabase.from('platform_admins').insert({ username: clean, password: password });
    if (res.error) {
      if (res.error.code === '23505') throw new Error('Username already taken.');
      throw res.error;
    }
    await loadAdmins();
  }

  async function handleDeleteAdmin(id) {
    if (!supabase) throw new Error('Supabase not configured.');
    const res = await supabase.from('platform_admins').delete().eq('id', id);
    if (res.error) throw res.error;
    await loadAdmins();
  }

  async function handleLogin(email, password) {
    const res = await supabase.auth.signInWithPassword({ email: email, password: password });
    if (res.error) throw res.error;
    toast.success('Welcome back!');
    setPublicView('shop');
  }

  async function handleSignup(email, password, shop) {
    const res = await supabase.auth.signUp({ email: email, password: password, options: { data: { shop_name: shop } } });
    if (res.error) throw res.error;
    if (res.data && res.data.user && !res.data.session) toast.info('Check your email to confirm.');
    else if (res.data && res.data.session) { toast.success('Account created!'); setPublicView('shop'); }
  }

  async function handleLogout() {
    try { await supabase.auth.signOut(); } catch (e) {}
    setRoute({ name:'dashboard', params:{} });
    setPublicView('landing');
  }

  async function createCustomer(data) {
    const res = await supabase.from('customers').insert({ name: data.name, phone: data.phone, measurements: {}, user_id: user.id }).select().single();
    if (res.error) throw res.error;
    return res.data;
  }
  async function updateCustomer(id, data) {
    const payload = Object.assign({}, data, { updated_at: new Date().toISOString() });
    const res = await supabase.from('customers').update(payload).eq('id', id);
    if (res.error) throw res.error;
  }
  async function deleteCustomer(id) {
    const res = await supabase.from('customers').delete().eq('id', id);
    if (res.error) throw res.error;
  }
  async function createOrder(data, existingOrders) {
    const nums = existingOrders.map(function(o){ return parseInt((o.order_code || 'ORD-1000').replace('ORD-', ''), 10); }).filter(function(n){return !isNaN(n);});
    const next = (nums.length ? Math.max.apply(null, nums) : 1000) + 1;
    const res = await supabase.from('orders').insert({
      order_code: 'ORD-' + next, customer_id: Number(data.customer_id), user_id: user.id,
      garment: data.garment, fabric: data.fabric || '', price: Number(data.price),
      advance: Number(data.advance) || 0, delivery_date: data.delivery_date, stage: 'Received', notes: data.notes || '',
    }).select().single();
    if (res.error) throw res.error;
    return res.data;
  }
  async function updateOrder(id, data) {
    const res = await supabase.from('orders').update(Object.assign({}, data, { updated_at: new Date().toISOString() })).eq('id', id);
    if (res.error) throw res.error;
  }
  async function moveOrderStage(id, stage) {
    const res = await supabase.from('orders').update({ stage: stage, updated_at: new Date().toISOString() }).eq('id', id);
    if (res.error) throw res.error;
  }
  async function deleteOrder(id) {
    const res = await supabase.from('orders').delete().eq('id', id);
    if (res.error) throw res.error;
  }

  const navigate = useCallback(function(r) {
    if (typeof r === 'string') setRoute({ name: r, params: {} });
    else { const params = r.params; const rest = Object.assign({}, r); delete rest.params; setRoute(rest); setRouteParams(params || {}); }
    setSidebarOpen(false);
    window.scrollTo({ top:0, behavior:'smooth' });
  }, []);

  const toastStack = (
    <div className="fixed bottom-4 right-4 z-[100] flex w-[calc(100%-2rem)] flex-col gap-2 no-print sm:w-96">
      {toasts.map(function(t){ return <Toast key={t.id} toast={t} onClose={function(){removeToast(t.id);}} />; })}
    </div>
  );

  if (!supabase) return <Fragment><SetupScreen error={supabaseInitError} />{toastStack}</Fragment>;
  if (authLoading) return <div className="flex min-h-screen items-center justify-center" style={{background:'rgb(var(--navy-50))'}}><div className="spinner" /></div>;

  if (isAdmin) {
    return <Fragment><AdminDashboardPage adminUser={adminUser} admins={admins} onAdd={handleAddAdmin} onDelete={handleDeleteAdmin} onLogout={handleAdminLogout} adminLoading={adminLoading} toast={toast} />{toastStack}</Fragment>;
  }

  if (!user) {
    if (publicView === 'landing') {
      return <Fragment><LandingPage onChooseAdmin={function(){setPublicView('admin');}} onChooseShop={function(){setPublicView('shop');}} />{toastStack}</Fragment>;
    }
    if (publicView === 'admin') {
      return <Fragment><PortalChoice mode="admin" onBack={function(){setPublicView('landing');}} onLogin={handleAdminLogin} onSignup={function(){}} />{toastStack}</Fragment>;
    }
    return <Fragment><PortalChoice mode="shop" onBack={function(){setPublicView('landing');}} onLogin={handleLogin} onSignup={handleSignup} />{toastStack}</Fragment>;
  }

  const titleMap = { dashboard:'Dashboard', customers:'Customers', customer:'Customer Profile', measurements:'Measurements', orders:'Orders Board', 'order-new':'New Order', order:'Order Details', 'order-slip':'Order Slip', payments:'Pending Payments', settings:'Settings' };

  function renderPage() {
    if (dataLoading) return <LoadingSpinner label="Loading your data…" />;
    switch (route.name) {
      case 'dashboard': return <DashboardPage customers={customers} orders={orders} onNav={navigate} />;
      case 'customers': return <CustomersPage customers={customers} orders={orders} onCreate={createCustomer} onUpdate={updateCustomer} onDelete={deleteCustomer} onNav={navigate} toast={toast} routeParams={routeParams} clearParams={function(){setRouteParams({});}} />;
      case 'customer': return <CustomerDetailPage customers={customers} orders={orders} onUpdate={updateCustomer} onDelete={deleteCustomer} onNav={navigate} toast={toast} customerId={Number(routeParams.id)} />;
      case 'measurements': return <MeasurementsPage customers={customers} onUpdate={updateCustomer} onNav={navigate} toast={toast} customerId={Number(routeParams.id)} />;
      case 'orders': return <OrdersBoardPage customers={customers} orders={orders} onMoveStage={moveOrderStage} onNav={navigate} toast={toast} routeParams={routeParams} />;
      case 'order-new': return <NewOrderPage customers={customers} orders={orders} onCreateOrder={createOrder} onNav={navigate} toast={toast} routeParams={routeParams} />;
      case 'order': return <OrderDetailPage customers={customers} orders={orders} onUpdateOrder={updateOrder} onMoveStage={moveOrderStage} onDeleteOrder={deleteOrder} onNav={navigate} toast={toast} orderId={Number(routeParams.id)} />;
      case 'order-slip': return <OrderSlipPage customers={customers} orders={orders} onNav={navigate} orderId={Number(routeParams.id)} />;
      case 'payments': return <PendingPaymentsPage customers={customers} orders={orders} onNav={navigate} toast={toast} />;
      case 'settings': return <SettingsPage user={user} shopName={shopName} onLogout={handleLogout} />;
      default: return <DashboardPage customers={customers} orders={orders} onNav={navigate} />;
    }
  }

  return (
    <div className="flex min-h-screen" style={{background:'rgb(var(--navy-50))'}}>
      <Sidebar open={sidebarOpen} onClose={function(){setSidebarOpen(false);}} user={user} shopName={shopName} onLogout={handleLogout} route={route} onNav={navigate} />
      <div className="flex min-w-0 flex-1 flex-col">
        <Topbar onMenuClick={function(){setSidebarOpen(true);}} title={titleMap[route.name] || 'Tailor Order Manager'} />
        <main className="flex-1 px-4 py-5 sm:px-6 sm:py-6 lg:px-8">{renderPage()}</main>
      </div>
      {toastStack}
    </div>
  );
}

// ============================================================
// MOUNT
// ============================================================
try {
  const rootEl = document.getElementById('root');
  if (rootEl) {
    rootEl.innerHTML = '';
    ReactDOM.createRoot(rootEl).render(<ErrorBoundary><App /></ErrorBoundary>);
    console.log('[Tailor] Mounted.');
  }
} catch (e) {
  document.getElementById('root').innerHTML = '<div style="padding:2rem;font-family:sans-serif;color:#dc2626;"><h2>Mount failed</h2><pre>' + String(e && e.message ? e.message : e) + '</pre></div>';
  console.error('[Tailor] Mount error:', e);
}
</script>
</body>
